name: Open Images zero-shot predicate mask

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/openimages-zero-shot-mask.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openimages-zero-shot-predicate-mask
  cancel-in-progress: false

jobs:
  prepare-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.sha }}
      TRAIN_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-train-annotations-vrd.csv
      VALIDATION_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-validation-annotations-vrd.csv
      CLASS_DESCRIPTIONS_URL: https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions-boxable.csv
      CLIP_MODEL: openai/clip-vit-base-patch32
      EXPECTED_VOCAB_SHA: d440fd6029cbae6d6b791717fea6125212b0f40998e57618f1f01388d1e8e990
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-real-smoke-torch.txt
            tools/relation_training/requirements-openimages-baseline.txt
            tools/relation_training/requirements-clip-prototypes.txt

      - name: Install prototype dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-real-smoke-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-openimages-baseline.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-clip-prototypes.txt

      - name: Recreate exact vocabulary
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          SCAN="$RUNNER_TEMP/openimages-scan"
          mkdir -p "$DATA" "$SUBSET"
          curl --fail --location --retry 3 "$TRAIN_VRD_URL" -o "$DATA/train-vrd.csv"
          curl --fail --location --retry 3 "$VALIDATION_VRD_URL" -o "$DATA/validation-vrd.csv"
          curl --fail --location --retry 3 "$CLASS_DESCRIPTIONS_URL" -o "$DATA/classes.csv"
          python tools/relation_training/convert_openimages.py subset \
            --split train \
            --relationships "$DATA/train-vrd.csv" \
            --max-images 256 \
            --min-boxes 4 \
            --max-boxes 12 \
            --output-csv "$SUBSET/train.csv"
          python tools/relation_training/convert_openimages.py subset \
            --split validation \
            --relationships "$DATA/validation-vrd.csv" \
            --max-images 64 \
            --min-boxes 4 \
            --max-boxes 12 \
            --output-csv "$SUBSET/validation.csv"
          python tools/relation_training/convert_openimages.py scan \
            --source "train=$SUBSET/train.csv" \
            --source "validation=$SUBSET/validation.csv" \
            --class-descriptions "$DATA/classes.csv" \
            --output-dir "$SCAN"
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/relation_training")
          from benchmark import RelationVocabulary

          path = Path(os.environ["RUNNER_TEMP"]) / "openimages-scan" / "vocabulary.json"
          actual = RelationVocabulary.load(path).sha256()
          expected = os.environ["EXPECTED_VOCAB_SHA"]
          if actual != expected:
              raise RuntimeError(
                  f"prototype vocabulary drift: {actual} != {expected}"
              )
          print(f"vocabulary_sha256={actual}")
          PY

      - name: Build one shared whitened CLIP prototype tensor
        env:
          HF_HOME: ${{ runner.temp }}/clip-hf-home
        shell: bash
        run: |
          set -euxo pipefail
          SHARED="$RUNNER_TEMP/shared-prototype"
          mkdir -p "$SHARED"
          python tools/relation_training/make_predicate_embeddings.py \
            --vocabulary "$RUNNER_TEMP/openimages-scan/vocabulary.json" \
            --out "$SHARED/predicate-prototypes.pt" \
            --mode clip-whitened \
            --clip-model "$CLIP_MODEL" \
            --device cpu
          cp "$RUNNER_TEMP/openimages-scan/vocabulary.json" "$SHARED/vocabulary.json"

      - uses: actions/upload-artifact@v4
        with:
          name: zero-shot-mask-shared-prototype-${{ github.run_id }}
          retention-days: 2
          path: ${{ runner.temp }}/shared-prototype/

  arm:
    needs: prepare-prototype
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: legacy
            mask_zero_support: 'false'
          - name: train-supported-only
            mask_zero_support: 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.sha }}
      TRAIN_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-train-annotations-vrd.csv
      VALIDATION_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-validation-annotations-vrd.csv
      CLASS_DESCRIPTIONS_URL: https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions-boxable.csv
      DOWNLOADER_URL: https://raw.githubusercontent.com/openimages/dataset/main/downloader.py
      DINOV3_MODEL: hf_hub:timm/vit_small_patch16_dinov3.lvd1689m
      EXPECTED_TRAIN_SHA: 6ed91bd451eea843b9a7cd9f60b9de58666eae3771fadfdb16fbab7ff9113c91
      EXPECTED_VALIDATION_SHA: 3281753dee803f67edb6a2f4868fa35c9cfdb40bb7da5b12fd3ec827401b72ce
      EXPECTED_VOCAB_SHA: d440fd6029cbae6d6b791717fea6125212b0f40998e57618f1f01388d1e8e990
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-real-smoke-torch.txt
            tools/relation_training/requirements-openimages-baseline.txt

      - name: Install focused experiment dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-real-smoke-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-openimages-baseline.txt

      - name: Download public Open Images annotations
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          mkdir -p "$DATA"
          curl --fail --location --retry 3 "$TRAIN_VRD_URL" -o "$DATA/train-vrd.csv"
          curl --fail --location --retry 3 "$VALIDATION_VRD_URL" -o "$DATA/validation-vrd.csv"
          curl --fail --location --retry 3 "$CLASS_DESCRIPTIONS_URL" -o "$DATA/classes.csv"

      - name: Recreate exact sampler-v1 slices
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          mkdir -p "$SUBSET"
          python tools/relation_training/convert_openimages.py subset \
            --split train \
            --relationships "$DATA/train-vrd.csv" \
            --max-images 256 \
            --min-boxes 4 \
            --max-boxes 12 \
            --output-csv "$SUBSET/train.csv"
          python tools/relation_training/convert_openimages.py subset \
            --split validation \
            --relationships "$DATA/validation-vrd.csv" \
            --max-images 64 \
            --min-boxes 4 \
            --max-boxes 12 \
            --output-csv "$SUBSET/validation.csv"

      - name: Build shared vocabulary and downloader lists
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          python tools/relation_training/convert_openimages.py scan \
            --source "train=$SUBSET/train.csv" \
            --source "validation=$SUBSET/validation.csv" \
            --class-descriptions "$DATA/classes.csv" \
            --output-dir "$RUNNER_TEMP/openimages-scan"

      - name: Download exact real pixels
        shell: bash
        run: |
          set -euxo pipefail
          SCAN="$RUNNER_TEMP/openimages-scan"
          IMAGES="$RUNNER_TEMP/openimages-images"
          curl --fail --location --retry 3 "$DOWNLOADER_URL" -o "$RUNNER_TEMP/openimages-downloader.py"
          python "$RUNNER_TEMP/openimages-downloader.py" \
            "$SCAN/train.image_ids.txt" \
            --download_folder="$IMAGES" \
            --num_processes=8
          python "$RUNNER_TEMP/openimages-downloader.py" \
            "$SCAN/validation.image_ids.txt" \
            --download_folder="$IMAGES" \
            --num_processes=8
          test "$(find "$IMAGES" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 320

      - name: Convert canonical splits
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          SCAN="$RUNNER_TEMP/openimages-scan"
          IMAGES="$RUNNER_TEMP/openimages-images"
          python tools/relation_training/convert_openimages.py convert \
            --split train \
            --relationships "$SUBSET/train.csv" \
            --class-descriptions "$DATA/classes.csv" \
            --vocabulary "$SCAN/vocabulary.json" \
            --image-root "$IMAGES" \
            --output-dir "$RUNNER_TEMP/openimages-train"
          python tools/relation_training/convert_openimages.py convert \
            --split validation \
            --relationships "$SUBSET/validation.csv" \
            --class-descriptions "$DATA/classes.csv" \
            --vocabulary "$SCAN/vocabulary.json" \
            --image-root "$IMAGES" \
            --output-dir "$RUNNER_TEMP/openimages-validation"

      - name: Assert exact experiment fingerprints
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/relation_training")
          from benchmark import RelationVocabulary

          root = Path(os.environ["RUNNER_TEMP"])
          train = root / "openimages-train" / "train.jsonl"
          validation = root / "openimages-validation" / "validation.jsonl"
          vocab_path = root / "openimages-scan" / "vocabulary.json"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          actual = {
              "train": sha(train),
              "validation": sha(validation),
              "vocabulary": RelationVocabulary.load(vocab_path).sha256(),
          }
          expected = {
              "train": os.environ["EXPECTED_TRAIN_SHA"],
              "validation": os.environ["EXPECTED_VALIDATION_SHA"],
              "vocabulary": os.environ["EXPECTED_VOCAB_SHA"],
          }
          if actual != expected:
              raise RuntimeError(
                  f"dataset fingerprint drift: actual={actual} expected={expected}"
              )
          PY

      - name: Download shared predicate prototypes
        uses: actions/download-artifact@v4
        with:
          name: zero-shot-mask-shared-prototype-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-prototype

      - name: Verify shared predicate prototype contract
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/relation_training")
          from benchmark import RelationVocabulary

          root = Path(os.environ["RUNNER_TEMP"])
          shared = root / "shared-prototype"
          current_vocab = RelationVocabulary.load(
              root / "openimages-scan" / "vocabulary.json"
          ).sha256()
          metadata = json.loads(
              (shared / "predicate-prototypes.pt.json").read_text()
          )
          if metadata["vocabulary_sha256"] != current_vocab:
              raise RuntimeError(
                  "prototype metadata vocabulary hash mismatch"
              )
          if metadata["mode"] != "clip-whitened":
              raise RuntimeError(
                  f"unexpected shared prototype mode: {metadata['mode']}"
              )
          if metadata["shape"] != [17, 512]:
              raise RuntimeError(
                  f"unexpected shared prototype shape: {metadata['shape']}"
              )
          print(
              f"prototype_tensor_sha256={metadata['tensor_sha256']}"
          )
          PY

      - name: Train zero-shot supervision arm
        env:
          HF_HOME: ${{ runner.temp }}/dino-hf-home
          ARM_NAME: ${{ matrix.name }}
          MASK_ZERO_SUPPORT: ${{ matrix.mask_zero_support }}
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/arm-$ARM_NAME"
          MASK_ARGS=()
          if [ "$MASK_ZERO_SUPPORT" = "true" ]; then
            MASK_ARGS+=(--mask-zero-support-predicates)
          fi
          python tools/relation_training/train_baseline.py \
            --train-annotations "$RUNNER_TEMP/openimages-train/train.jsonl" \
            --validation-annotations "$RUNNER_TEMP/openimages-validation/validation.jsonl" \
            --vocabulary "$RUNNER_TEMP/openimages-scan/vocabulary.json" \
            --image-root "$RUNNER_TEMP/openimages-images" \
            --predicate-embeddings "$RUNNER_TEMP/shared-prototype/predicate-prototypes.pt" \
            --output-dir "$OUT" \
            --backbone "$DINOV3_MODEL" \
            --image-size 224 \
            --max-boxes 12 \
            --pair-budget 48 \
            --hidden-dim 128 \
            --geometry-dim 32 \
            --num-heads 4 \
            --num-layers 2 \
            --epochs 3 \
            --batch-size 8 \
            --learning-rate 0.001 \
            --weight-decay 0.0001 \
            --sampler-loss-weight 1.0 \
            --pair-loss-weight 1.0 \
            --predicate-loss-weight 1.0 \
            --predicate-positive-weight-mode sqrt-balanced \
            --predicate-positive-weight-cap 20 \
            --device cpu \
            "${MASK_ARGS[@]}"

      - name: Build arm evidence
        env:
          ARM_NAME: ${{ matrix.name }}
          MASK_ZERO_SUPPORT: ${{ matrix.mask_zero_support }}
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/arm-$ARM_NAME"
          EVIDENCE="$RUNNER_TEMP/evidence-$ARM_NAME"
          mkdir -p "$EVIDENCE"
          cp "$OUT/training.json" "$EVIDENCE/"
          cp "$OUT/benchmark.json" "$EVIDENCE/"
          cp "$RUNNER_TEMP/shared-prototype/predicate-prototypes.pt.json" "$EVIDENCE/prototypes.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          arm = os.environ["ARM_NAME"]
          evidence = Path(os.environ["RUNNER_TEMP"]) / f"evidence-{arm}"
          payload = {
              "schema": "kfcore.zero-shot-predicate-mask-arm/1",
              "exact_head": os.environ["EXPECTED_SHA"],
              "arm": arm,
              "mask_zero_support": (
                  os.environ["MASK_ZERO_SUPPORT"] == "true"
              ),
              "pair_budget": 48,
              "predicate_weighting": "sqrt-balanced",
              "train_images": 256,
              "validation_images": 64,
              "epochs": 3,
              "seed": 20260929,
              "checkpoint_uploaded": False,
              "images_uploaded": False,
              "annotations_uploaded": False,
          }
          (evidence / "arm.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zero-shot-mask-${{ matrix.name }}-${{ github.run_id }}
          retention-days: 14
          path: ${{ runner.temp }}/evidence-${{ matrix.name }}/

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

  compare:
    runs-on: ubuntu-24.04
    needs: arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zero-shot-mask-*
          path: arms
          merge-multiple: false

      - name: Compare zero-shot supervision arms
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          rows = {}
          for arm_json in sorted(Path("arms").glob("*/arm.json")):
              root = arm_json.parent
              arm = json.loads(arm_json.read_text())
              training = json.loads((root / "training.json").read_text())
              benchmark = json.loads((root / "benchmark.json").read_text())
              prototypes = json.loads((root / "prototypes.json").read_text())
              groups = benchmark["predicate_groups"]
              row = {
                  "arm": arm["arm"],
                  "mask_zero_support": arm["mask_zero_support"],
                  "prototype_tensor_sha256": prototypes["tensor_sha256"],
                  "trainable_parameter_count": training["trainable_parameter_count"],
                  "train_annotations_sha256": training["train_annotations_sha256"],
                  "validation_annotations_sha256": training["validation_annotations_sha256"],
                  "vocabulary_sha256": training["vocabulary_sha256"],
                  "predicate_weighting": training["predicate_weighting"],
                  "predicate_supervision": training["predicate_supervision"],
                  "sampler_recall": benchmark["sampler_recall"],
                  "pair_ap": benchmark["pair_ap"],
                  "predicate_top1_accuracy": benchmark[
                      "predicate_top1_accuracy_on_sampled_pairs"
                  ],
                  "r20": benchmark["recall_at_k"]["20"],
                  "r50": benchmark["recall_at_k"]["50"],
                  "r100": benchmark["recall_at_k"]["100"],
                  "mr20": benchmark["mean_recall_at_k"]["20"],
                  "mr50": benchmark["mean_recall_at_k"]["50"],
                  "mr100": benchmark["mean_recall_at_k"]["100"],
                  "seen_mr20": groups["seen"]["mean_recall_at_k"]["20"],
                  "seen_mr50": groups["seen"]["mean_recall_at_k"]["50"],
                  "seen_mr100": groups["seen"]["mean_recall_at_k"]["100"],
                  "zero_shot_mr20": groups[
                      "train_zero_support"
                  ]["mean_recall_at_k"]["20"],
                  "zero_shot_mr50": groups[
                      "train_zero_support"
                  ]["mean_recall_at_k"]["50"],
                  "zero_shot_mr100": groups[
                      "train_zero_support"
                  ]["mean_recall_at_k"]["100"],
                  "zero_shot_predicate_indices": groups[
                      "train_zero_support"
                  ]["predicate_indices"],
              }
              rows[arm["arm"]] = row

          if set(rows) != {"legacy", "train-supported-only"}:
              raise RuntimeError(
                  f"unexpected zero-shot arms: {sorted(rows)}"
              )
          legacy = rows["legacy"]
          masked = rows["train-supported-only"]

          for key in (
              "prototype_tensor_sha256",
              "trainable_parameter_count",
              "train_annotations_sha256",
              "validation_annotations_sha256",
              "vocabulary_sha256",
              "predicate_weighting",
          ):
              if legacy[key] != masked[key]:
                  raise RuntimeError(
                      f"A/B contract mismatch for {key}: "
                      f"{legacy[key]} != {masked[key]}"
                  )

          if legacy["predicate_supervision"]["mode"] != "all":
              raise RuntimeError("legacy arm supervision mode drifted")
          if masked["predicate_supervision"]["mode"] != "train-supported-only":
              raise RuntimeError("masked arm supervision mode drifted")
          expected_masked = legacy["predicate_weighting"][
              "zero_support_predicate_indices"
          ]
          if (
              masked["predicate_supervision"]["masked_predicate_indices"]
              != expected_masked
          ):
              raise RuntimeError(
                  "masked predicate indices do not match train zero-support"
              )

          metric_keys = (
              "sampler_recall",
              "pair_ap",
              "predicate_top1_accuracy",
              "r20",
              "r50",
              "r100",
              "mr20",
              "mr50",
              "mr100",
              "seen_mr20",
              "seen_mr50",
              "seen_mr100",
              "zero_shot_mr20",
              "zero_shot_mr50",
              "zero_shot_mr100",
          )
          delta = {
              key: masked[key] - legacy[key]
              for key in metric_keys
          }
          payload = {
              "schema": "kfcore.zero-shot-predicate-mask/1",
              "legacy": legacy,
              "train_supported_only": masked,
              "masked_minus_legacy": delta,
          }
          Path("comparison.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zero-shot-mask-comparison-${{ github.run_id }}
          retention-days: 30
          path: comparison.json
