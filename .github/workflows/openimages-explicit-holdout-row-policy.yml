name: Open Images explicit holdout row policy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/openimages-explicit-holdout-row-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openimages-explicit-holdout-row-policy
  cancel-in-progress: false

jobs:
  prepare-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.sha }}
      TRAIN_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-train-annotations-vrd.csv
      VALIDATION_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-validation-annotations-vrd.csv
      CLASS_DESCRIPTIONS_URL: https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions-boxable.csv
      CLIP_MODEL: openai/clip-vit-base-patch32
      EXPECTED_VOCAB_SHA: d440fd6029cbae6d6b791717fea6125212b0f40998e57618f1f01388d1e8e990
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-real-smoke-torch.txt
            tools/relation_training/requirements-openimages-baseline.txt
            tools/relation_training/requirements-clip-prototypes.txt

      - name: Install prototype dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-real-smoke-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-openimages-baseline.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-clip-prototypes.txt

      - name: Recreate exact vocabulary
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          SCAN="$RUNNER_TEMP/openimages-scan"
          mkdir -p "$DATA" "$SUBSET"
          curl --fail --location --retry 3 "$TRAIN_VRD_URL" -o "$DATA/train-vrd.csv"
          curl --fail --location --retry 3 "$VALIDATION_VRD_URL" -o "$DATA/validation-vrd.csv"
          curl --fail --location --retry 3 "$CLASS_DESCRIPTIONS_URL" -o "$DATA/classes.csv"
          python tools/relation_training/convert_openimages.py subset \
            --split train \
            --relationships "$DATA/train-vrd.csv" \
            --max-images 256 \
            --min-boxes 4 \
            --max-boxes 12 \
            --output-csv "$SUBSET/train.csv"
          python tools/relation_training/convert_openimages.py subset \
            --split validation \
            --relationships "$DATA/validation-vrd.csv" \
            --max-images 64 \
            --min-boxes 4 \
            --max-boxes 12 \
            --output-csv "$SUBSET/validation.csv"
          python tools/relation_training/convert_openimages.py scan \
            --source "train=$SUBSET/train.csv" \
            --source "validation=$SUBSET/validation.csv" \
            --class-descriptions "$DATA/classes.csv" \
            --output-dir "$SCAN"
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/relation_training")
          from benchmark import RelationVocabulary

          path = Path(os.environ["RUNNER_TEMP"]) / "openimages-scan" / "vocabulary.json"
          actual = RelationVocabulary.load(path).sha256()
          expected = os.environ["EXPECTED_VOCAB_SHA"]
          if actual != expected:
              raise RuntimeError(
                  f"prototype vocabulary drift: {actual} != {expected}"
              )
          PY

      - name: Build one shared whitened CLIP prototype tensor
        env:
          HF_HOME: ${{ runner.temp }}/clip-hf-home
        shell: bash
        run: |
          set -euxo pipefail
          SHARED="$RUNNER_TEMP/shared-prototype"
          mkdir -p "$SHARED"
          python tools/relation_training/make_predicate_embeddings.py \
            --vocabulary "$RUNNER_TEMP/openimages-scan/vocabulary.json" \
            --out "$SHARED/predicate-prototypes.pt" \
            --mode clip-whitened \
            --clip-model "$CLIP_MODEL" \
            --device cpu
          cp "$RUNNER_TEMP/openimages-scan/vocabulary.json" "$SHARED/vocabulary.json"

      - uses: actions/upload-artifact@v4
        with:
          name: holdout-row-policy-shared-prototype-${{ github.run_id }}
          retention-days: 2
          path: ${{ runner.temp }}/shared-prototype/

  arm:
    needs: prepare-prototype
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            holdout: 'false'
            row_policy: dimension-only
          - name: dimension-only
            holdout: 'true'
            row_policy: dimension-only
          - name: skip-holdout-only
            holdout: 'true'
            row_policy: skip-holdout-only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.sha }}
      TRAIN_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-train-annotations-vrd.csv
      VALIDATION_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-validation-annotations-vrd.csv
      CLASS_DESCRIPTIONS_URL: https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions-boxable.csv
      DOWNLOADER_URL: https://raw.githubusercontent.com/openimages/dataset/main/downloader.py
      DINOV3_MODEL: hf_hub:timm/vit_small_patch16_dinov3.lvd1689m
      EXPECTED_TRAIN_SHA: 6ed91bd451eea843b9a7cd9f60b9de58666eae3771fadfdb16fbab7ff9113c91
      EXPECTED_VALIDATION_SHA: 3281753dee803f67edb6a2f4868fa35c9cfdb40bb7da5b12fd3ec827401b72ce
      EXPECTED_VOCAB_SHA: d440fd6029cbae6d6b791717fea6125212b0f40998e57618f1f01388d1e8e990
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-real-smoke-torch.txt
            tools/relation_training/requirements-openimages-baseline.txt

      - name: Install focused experiment dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-real-smoke-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-openimages-baseline.txt

      - name: Download public Open Images annotations
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          mkdir -p "$DATA"
          curl --fail --location --retry 3 "$TRAIN_VRD_URL" -o "$DATA/train-vrd.csv"
          curl --fail --location --retry 3 "$VALIDATION_VRD_URL" -o "$DATA/validation-vrd.csv"
          curl --fail --location --retry 3 "$CLASS_DESCRIPTIONS_URL" -o "$DATA/classes.csv"

      - name: Recreate exact sampler-v1 slices
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          mkdir -p "$SUBSET"
          python tools/relation_training/convert_openimages.py subset \
            --split train \
            --relationships "$DATA/train-vrd.csv" \
            --max-images 256 \
            --min-boxes 4 \
            --max-boxes 12 \
            --output-csv "$SUBSET/train.csv"
          python tools/relation_training/convert_openimages.py subset \
            --split validation \
            --relationships "$DATA/validation-vrd.csv" \
            --max-images 64 \
            --min-boxes 4 \
            --max-boxes 12 \
            --output-csv "$SUBSET/validation.csv"

      - name: Build shared vocabulary and downloader lists
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          python tools/relation_training/convert_openimages.py scan \
            --source "train=$SUBSET/train.csv" \
            --source "validation=$SUBSET/validation.csv" \
            --class-descriptions "$DATA/classes.csv" \
            --output-dir "$RUNNER_TEMP/openimages-scan"

      - name: Download exact real pixels
        shell: bash
        run: |
          set -euxo pipefail
          SCAN="$RUNNER_TEMP/openimages-scan"
          IMAGES="$RUNNER_TEMP/openimages-images"
          curl --fail --location --retry 3 "$DOWNLOADER_URL" -o "$RUNNER_TEMP/openimages-downloader.py"
          python "$RUNNER_TEMP/openimages-downloader.py" \
            "$SCAN/train.image_ids.txt" \
            --download_folder="$IMAGES" \
            --num_processes=8
          python "$RUNNER_TEMP/openimages-downloader.py" \
            "$SCAN/validation.image_ids.txt" \
            --download_folder="$IMAGES" \
            --num_processes=8
          test "$(find "$IMAGES" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 320

      - name: Convert canonical splits
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          SCAN="$RUNNER_TEMP/openimages-scan"
          IMAGES="$RUNNER_TEMP/openimages-images"
          python tools/relation_training/convert_openimages.py convert \
            --split train \
            --relationships "$SUBSET/train.csv" \
            --class-descriptions "$DATA/classes.csv" \
            --vocabulary "$SCAN/vocabulary.json" \
            --image-root "$IMAGES" \
            --output-dir "$RUNNER_TEMP/openimages-train"
          python tools/relation_training/convert_openimages.py convert \
            --split validation \
            --relationships "$SUBSET/validation.csv" \
            --class-descriptions "$DATA/classes.csv" \
            --vocabulary "$SCAN/vocabulary.json" \
            --image-root "$IMAGES" \
            --output-dir "$RUNNER_TEMP/openimages-validation"

      - name: Assert exact experiment fingerprints
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/relation_training")
          from benchmark import RelationVocabulary

          root = Path(os.environ["RUNNER_TEMP"])
          train = root / "openimages-train" / "train.jsonl"
          validation = root / "openimages-validation" / "validation.jsonl"
          vocab_path = root / "openimages-scan" / "vocabulary.json"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          actual = {
              "train": sha(train),
              "validation": sha(validation),
              "vocabulary": RelationVocabulary.load(vocab_path).sha256(),
          }
          expected = {
              "train": os.environ["EXPECTED_TRAIN_SHA"],
              "validation": os.environ["EXPECTED_VALIDATION_SHA"],
              "vocabulary": os.environ["EXPECTED_VOCAB_SHA"],
          }
          if actual != expected:
              raise RuntimeError(
                  f"dataset fingerprint drift: actual={actual} expected={expected}"
              )
          PY

      - name: Download shared predicate prototypes
        uses: actions/download-artifact@v4
        with:
          name: holdout-row-policy-shared-prototype-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-prototype

      - name: Verify shared predicate prototype contract
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/relation_training")
          from benchmark import RelationVocabulary

          root = Path(os.environ["RUNNER_TEMP"])
          shared = root / "shared-prototype"
          current_vocab = RelationVocabulary.load(
              root / "openimages-scan" / "vocabulary.json"
          ).sha256()
          metadata = json.loads(
              (shared / "predicate-prototypes.pt.json").read_text()
          )
          if metadata["vocabulary_sha256"] != current_vocab:
              raise RuntimeError(
                  "prototype metadata vocabulary hash mismatch"
              )
          if metadata["mode"] != "clip-whitened":
              raise RuntimeError(
                  f"unexpected shared prototype mode: {metadata['mode']}"
              )
          if metadata["shape"] != [17, 512]:
              raise RuntimeError(
                  f"unexpected shared prototype shape: {metadata['shape']}"
              )
          PY

      - name: Train explicit-holdout arm
        env:
          HF_HOME: ${{ runner.temp }}/dino-hf-home
          ARM_NAME: ${{ matrix.name }}
          HOLDOUT_ENABLED: ${{ matrix.holdout }}
          HOLDOUT_ROW_POLICY: ${{ matrix.row_policy }}
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/arm-$ARM_NAME"
          HOLDOUT_ARGS=()
          if [ "$HOLDOUT_ENABLED" = "true" ]; then
            HOLDOUT_ARGS+=(
              --holdout-predicate contain
              --holdout-predicate holds
              --holdout-predicate ride
            )
          fi
          python tools/relation_training/train_baseline.py \
            --train-annotations "$RUNNER_TEMP/openimages-train/train.jsonl" \
            --validation-annotations "$RUNNER_TEMP/openimages-validation/validation.jsonl" \
            --vocabulary "$RUNNER_TEMP/openimages-scan/vocabulary.json" \
            --image-root "$RUNNER_TEMP/openimages-images" \
            --predicate-embeddings "$RUNNER_TEMP/shared-prototype/predicate-prototypes.pt" \
            --output-dir "$OUT" \
            --backbone "$DINOV3_MODEL" \
            --image-size 224 \
            --max-boxes 12 \
            --pair-budget 48 \
            --hidden-dim 128 \
            --geometry-dim 32 \
            --num-heads 4 \
            --num-layers 2 \
            --predicate-adapter-rank 0 \
            --epochs 3 \
            --batch-size 8 \
            --learning-rate 0.001 \
            --weight-decay 0.0001 \
            --sampler-loss-weight 1.0 \
            --pair-loss-weight 1.0 \
            --predicate-loss-weight 1.0 \
            --predicate-positive-weight-mode sqrt-balanced \
            --predicate-positive-weight-cap 20 \
            --zero-support-negative-weight 0.10 \
            --holdout-row-policy "$HOLDOUT_ROW_POLICY" \
            --device cpu \
            "${HOLDOUT_ARGS[@]}"

      - name: Build arm evidence
        env:
          ARM_NAME: ${{ matrix.name }}
          HOLDOUT_ENABLED: ${{ matrix.holdout }}
          HOLDOUT_ROW_POLICY: ${{ matrix.row_policy }}
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/arm-$ARM_NAME"
          EVIDENCE="$RUNNER_TEMP/evidence-$ARM_NAME"
          mkdir -p "$EVIDENCE"
          cp "$OUT/training.json" "$EVIDENCE/"
          cp "$OUT/benchmark.json" "$EVIDENCE/"
          cp "$RUNNER_TEMP/shared-prototype/predicate-prototypes.pt.json" "$EVIDENCE/prototypes.json"
          cp "$RUNNER_TEMP/openimages-scan/vocabulary.json" "$EVIDENCE/"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          arm = os.environ["ARM_NAME"]
          enabled = os.environ["HOLDOUT_ENABLED"].lower() == "true"
          evidence = Path(os.environ["RUNNER_TEMP"]) / f"evidence-{arm}"
          payload = {
              "schema": "kfcore.explicit-holdout-row-policy-arm/1",
              "exact_head": os.environ["EXPECTED_SHA"],
              "arm": arm,
              "holdout_enabled": enabled,
              "holdout_predicates": (
                  ["contain", "holds", "ride"] if enabled else []
              ),
              "holdout_row_policy": os.environ["HOLDOUT_ROW_POLICY"],
              "zero_support_negative_weight": 0.10,
              "pair_budget": 48,
              "predicate_weighting": "sqrt-balanced",
              "predicate_adapter_rank": 0,
              "train_images": 256,
              "validation_images": 64,
              "epochs": 3,
              "seed": 20260929,
              "checkpoint_uploaded": False,
              "images_uploaded": False,
              "annotations_uploaded": False,
          }
          (evidence / "arm.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: holdout-row-policy-arm-${{ matrix.name }}-${{ github.run_id }}
          retention-days: 14
          path: ${{ runner.temp }}/evidence-${{ matrix.name }}/

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

  compare:
    runs-on: ubuntu-24.04
    needs: arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: holdout-row-policy-arm-*
          path: arms
          merge-multiple: false

      - name: Compare explicit holdout row policies
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          HOLDOUT_NAMES = ("contain", "holds", "ride")
          TOP_KS = ("20", "50", "100")

          def metric_group(benchmark, indices):
              by_index = {
                  item["predicate_index"]: item
                  for item in benchmark["per_predicate"]
              }
              ordered = sorted(indices)
              if not ordered:
                  raise RuntimeError("metric group must not be empty")
              for index in ordered:
                  if by_index[index]["support"] <= 0:
                      raise RuntimeError(
                          f"predicate {index} has no validation support"
                      )
              return {
                  "predicate_indices": ordered,
                  "predicate_count": len(ordered),
                  "validation_triplet_support": sum(
                      by_index[index]["support"]
                      for index in ordered
                  ),
                  "mean_recall_at_k": {
                      k: sum(
                          by_index[index]["recall"][k]
                          for index in ordered
                      ) / len(ordered)
                      for k in TOP_KS
                  },
              }

          rows = {}
          for arm_json in sorted(Path("arms").glob("*/arm.json")):
              root = arm_json.parent
              arm = json.loads(arm_json.read_text())
              training = json.loads((root / "training.json").read_text())
              benchmark = json.loads((root / "benchmark.json").read_text())
              prototypes = json.loads((root / "prototypes.json").read_text())
              vocabulary = json.loads((root / "vocabulary.json").read_text())
              predicate_names = vocabulary["predicates"]
              holdout_indices = sorted(
                  predicate_names.index(name)
                  for name in HOLDOUT_NAMES
              )
              original_support = training[
                  "predicate_weighting"
              ]["predicate_positive_counts"]
              retained_seen_indices = [
                  index
                  for index, item in enumerate(benchmark["per_predicate"])
                  if (
                      item["support"] > 0
                      and original_support[index] > 0
                      and index not in holdout_indices
                  )
              ]
              natural_zero_indices = [
                  index
                  for index, item in enumerate(benchmark["per_predicate"])
                  if item["support"] > 0 and original_support[index] == 0
              ]
              groups = benchmark["predicate_groups"]
              holdout_eval = metric_group(
                  benchmark, holdout_indices
              )
              retained_seen_eval = metric_group(
                  benchmark, retained_seen_indices
              )
              natural_zero_eval = metric_group(
                  benchmark, natural_zero_indices
              )

              if groups["train_zero_support"] != natural_zero_eval:
                  raise RuntimeError(
                      f"{arm['arm']} natural zero-support grouping drift"
                  )
              if arm["holdout_enabled"]:
                  if groups.get("explicit_holdout") != holdout_eval:
                      raise RuntimeError(
                          f"{arm['arm']} explicit holdout group mismatch"
                      )
                  if groups["seen"] != retained_seen_eval:
                      raise RuntimeError(
                          f"{arm['arm']} holdouts leaked into seen group"
                      )
              elif "explicit_holdout" in groups:
                  raise RuntimeError(
                      "baseline unexpectedly reports explicit holdout group"
                  )

              history = training["history"]
              skipped_rows = sum(
                  int(epoch["predicate_rows_skipped"])
                  for epoch in history
              )
              predicate_rows = sum(
                  int(epoch["predicate_rows"])
                  for epoch in history
              )
              adapter = training["predicate_adapter"]
              row = {
                  "arm": arm["arm"],
                  "holdout_enabled": arm["holdout_enabled"],
                  "holdout_row_policy": arm["holdout_row_policy"],
                  "holdout_indices": holdout_indices,
                  "predicate_rows": predicate_rows,
                  "predicate_rows_skipped": skipped_rows,
                  "prototype_tensor_sha256": prototypes["tensor_sha256"],
                  "predicate_embeddings_sha256": training[
                      "predicate_embeddings_sha256"
                  ],
                  "predicate_embedding_shape": training[
                      "predicate_embedding_shape"
                  ],
                  "trainable_parameter_count": training[
                      "trainable_parameter_count"
                  ],
                  "train_annotations_sha256": training[
                      "train_annotations_sha256"
                  ],
                  "validation_annotations_sha256": training[
                      "validation_annotations_sha256"
                  ],
                  "vocabulary_sha256": training["vocabulary_sha256"],
                  "model_config": training["model_config"],
                  "baseline_config": training["baseline_config"],
                  "loss_config": training["loss_config"],
                  "benchmark_config": training["benchmark_config"],
                  "predicate_weighting": training["predicate_weighting"],
                  "predicate_negative_weighting": training[
                      "predicate_negative_weighting"
                  ],
                  "predicate_supervision": training[
                      "predicate_supervision"
                  ],
                  "predicate_adapter_contract": {
                      "rank": adapter["rank"],
                      "parameter_count": adapter["parameter_count"],
                      "source_tensor_sha256": adapter[
                          "source_tensor_sha256"
                      ],
                      "effective_tensor_sha256": adapter[
                          "effective_tensor_sha256"
                      ],
                  },
                  "sampler_recall": benchmark["sampler_recall"],
                  "pair_ap": benchmark["pair_ap"],
                  "predicate_top1_accuracy": benchmark[
                      "predicate_top1_accuracy_on_sampled_pairs"
                  ],
                  "r20": benchmark["recall_at_k"]["20"],
                  "r50": benchmark["recall_at_k"]["50"],
                  "r100": benchmark["recall_at_k"]["100"],
                  "mr20": benchmark["mean_recall_at_k"]["20"],
                  "mr50": benchmark["mean_recall_at_k"]["50"],
                  "mr100": benchmark["mean_recall_at_k"]["100"],
                  "retained_seen_mr20": retained_seen_eval[
                      "mean_recall_at_k"
                  ]["20"],
                  "retained_seen_mr50": retained_seen_eval[
                      "mean_recall_at_k"
                  ]["50"],
                  "retained_seen_mr100": retained_seen_eval[
                      "mean_recall_at_k"
                  ]["100"],
                  "natural_zero_mr20": natural_zero_eval[
                      "mean_recall_at_k"
                  ]["20"],
                  "natural_zero_mr50": natural_zero_eval[
                      "mean_recall_at_k"
                  ]["50"],
                  "natural_zero_mr100": natural_zero_eval[
                      "mean_recall_at_k"
                  ]["100"],
                  "holdout_mr20": holdout_eval[
                      "mean_recall_at_k"
                  ]["20"],
                  "holdout_mr50": holdout_eval[
                      "mean_recall_at_k"
                  ]["50"],
                  "holdout_mr100": holdout_eval[
                      "mean_recall_at_k"
                  ]["100"],
              }
              rows[arm["arm"]] = row

          expected = {
              "baseline",
              "dimension-only",
              "skip-holdout-only",
          }
          if set(rows) != expected:
              raise RuntimeError(
                  f"unexpected row-policy arms: {sorted(rows)}"
              )

          baseline = rows["baseline"]
          dimension = rows["dimension-only"]
          skipped = rows["skip-holdout-only"]

          exact_contract_keys = (
              "prototype_tensor_sha256",
              "predicate_embeddings_sha256",
              "predicate_embedding_shape",
              "trainable_parameter_count",
              "train_annotations_sha256",
              "validation_annotations_sha256",
              "vocabulary_sha256",
              "model_config",
              "baseline_config",
              "loss_config",
              "benchmark_config",
              "predicate_weighting",
              "predicate_negative_weighting",
              "predicate_adapter_contract",
          )
          for candidate in (dimension, skipped):
              for key in exact_contract_keys:
                  if baseline[key] != candidate[key]:
                      raise RuntimeError(
                          f"A/B contract mismatch for {candidate['arm']} {key}"
                      )

          if baseline["holdout_enabled"]:
              raise RuntimeError("baseline unexpectedly enables holdout")
          if baseline["holdout_row_policy"] != "dimension-only":
              raise RuntimeError("baseline row policy drifted")
          if baseline["predicate_rows_skipped"] != 0:
              raise RuntimeError("baseline unexpectedly skipped predicate rows")

          for candidate, expected_policy in (
              (dimension, "dimension-only"),
              (skipped, "skip-holdout-only"),
          ):
              supervision = candidate["predicate_supervision"]
              if not candidate["holdout_enabled"]:
                  raise RuntimeError(
                      f"{candidate['arm']} did not enable holdout"
                  )
              if candidate["holdout_row_policy"] != expected_policy:
                  raise RuntimeError(
                      f"{candidate['arm']} row policy drifted"
                  )
              if supervision["mode"] != "explicit-holdout":
                  raise RuntimeError(
                      f"{candidate['arm']} supervision mode drifted"
                  )
              if supervision["holdout_row_policy"] != expected_policy:
                  raise RuntimeError(
                      f"{candidate['arm']} evidence row policy drifted"
                  )
              if supervision["held_out_predicate_indices"] != candidate[
                  "holdout_indices"
              ]:
                  raise RuntimeError(
                      f"{candidate['arm']} holdout indices drifted"
                  )
              if set(
                  supervision["held_out_predicate_names"]
              ) != set(HOLDOUT_NAMES):
                  raise RuntimeError(
                      f"{candidate['arm']} holdout names drifted"
                  )

          if dimension["predicate_rows_skipped"] != 0:
              raise RuntimeError(
                  "dimension-only unexpectedly skipped predicate rows"
              )
          if skipped["predicate_rows_skipped"] <= 0:
              raise RuntimeError(
                  "skip-holdout-only did not skip any predicate rows"
              )

          original = baseline[
              "predicate_supervision"
          ]["original_train_predicate_support"]
          for candidate in (dimension, skipped):
              supervision = candidate["predicate_supervision"]
              if supervision[
                  "original_train_predicate_support"
              ] != original:
                  raise RuntimeError("original train support drifted")
              expected_effective = list(original)
              for index in candidate["holdout_indices"]:
                  expected_effective[index] = 0
              if supervision[
                  "effective_train_predicate_support"
              ] != expected_effective:
                  raise RuntimeError(
                      f"{candidate['arm']} effective support drifted"
                  )

          metric_keys = (
              "sampler_recall",
              "pair_ap",
              "predicate_top1_accuracy",
              "r20",
              "r50",
              "r100",
              "mr20",
              "mr50",
              "mr100",
              "retained_seen_mr20",
              "retained_seen_mr50",
              "retained_seen_mr100",
              "natural_zero_mr20",
              "natural_zero_mr50",
              "natural_zero_mr100",
              "holdout_mr20",
              "holdout_mr50",
              "holdout_mr100",
          )

          def delta(left, right):
              return {
                  key: left[key] - right[key]
                  for key in metric_keys
              }

          payload = {
              "schema": "kfcore.explicit-holdout-row-policy/1",
              "holdout_predicates": list(HOLDOUT_NAMES),
              "zero_support_negative_weight": 0.10,
              "baseline": baseline,
              "dimension_only": dimension,
              "skip_holdout_only": skipped,
              "dimension_minus_baseline": delta(
                  dimension, baseline
              ),
              "skip_minus_dimension": delta(
                  skipped, dimension
              ),
              "skip_minus_baseline": delta(
                  skipped, baseline
              ),
          }
          Path("comparison.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: holdout-row-policy-comparison-${{ github.run_id }}
          retention-days: 30
          path: comparison.json
