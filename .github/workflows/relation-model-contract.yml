name: DINO relation model contract

on:
  pull_request:
    branches: [master]
    paths:
      - 'tools/relation_training/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/relation-model-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relation-model-contract-onnx-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-ci-torch.txt
            tools/relation_training/requirements-ci.txt

      - name: Install focused CPU dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-ci-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-ci.txt

      - name: Compile Python contracts
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile \
            tools/relation_training/model.py \
            tools/relation_training/losses.py \
            tools/relation_training/checkpoint.py \
            tools/relation_training/export_onnx.py \
            tools/relation_training/real_dinov3_smoke.py \
            tools/relation_training/test_model.py

      - name: Run synthetic forward/backward and ONNX contract
        shell: bash
        working-directory: tools/relation_training
        run: |
          set -euxo pipefail
          python -m unittest -v test_model.py

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

  real-vits16:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DINOV3_REPO_COMMIT: 6876159a11b4df116f30f667f8c9888617df0751
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-ci-torch.txt
            tools/relation_training/requirements-real-smoke.txt

      - name: Install real-smoke dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-ci-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-real-smoke.txt

      - name: Checkout official DINOv3 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/dinov3"
          git init "$RUNNER_TEMP/dinov3"
          git -C "$RUNNER_TEMP/dinov3" remote add origin https://github.com/facebookresearch/dinov3.git
          git -C "$RUNNER_TEMP/dinov3" fetch --depth 1 origin "$DINOV3_REPO_COMMIT"
          git -C "$RUNNER_TEMP/dinov3" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/dinov3" rev-parse HEAD)" = "$DINOV3_REPO_COMMIT"

      - name: Download official DINOv3 ViT-S/16 weights
        env:
          DINOV3_WEIGHTS_URL: ${{ secrets.DINOV3_WEIGHTS_URL }}
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${DINOV3_WEIGHTS_URL:-}"
          WEIGHTS="$RUNNER_TEMP/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$WEIGHTS" \
            "$DINOV3_WEIGHTS_URL"
          test -s "$WEIGHTS"
          sha256sum "$WEIGHTS"

      - name: Run real DINOv3 ViT-S/16 forward and export smoke
        shell: bash
        run: |
          set -euxo pipefail
          WEIGHTS="$RUNNER_TEMP/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"
          OUT="$RUNNER_TEMP/real-dinov3-smoke"
          mkdir -p "$OUT"
          python tools/relation_training/real_dinov3_smoke.py \
            --repo-dir "$RUNNER_TEMP/dinov3" \
            --weights "$WEIGHTS" \
            --expected-repo-commit "$DINOV3_REPO_COMMIT" \
            --image-size 224 \
            --output-dir "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: real-dinov3-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: ${{ runner.temp }}/real-dinov3-smoke/real-dinov3-smoke.json

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
