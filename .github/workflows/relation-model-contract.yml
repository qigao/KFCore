name: DINO relation model contract

on:
  pull_request:
    branches: [master]
    paths:
      - 'tools/relation_training/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/relation-model-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relation-model-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/relation_training/requirements-ci.txt

      - name: Install focused CPU dependency
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             -r tools/relation_training/requirements-ci.txt

      - name: Compile Python contracts
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile             tools/relation_training/model.py             tools/relation_training/losses.py             tools/relation_training/checkpoint.py             tools/relation_training/export_onnx.py             tools/relation_training/test_model.py

      - name: Run synthetic forward/backward contract
        shell: bash
        working-directory: tools/relation_training
        run: |
          set -euxo pipefail
          python -m unittest -v test_model.py

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
