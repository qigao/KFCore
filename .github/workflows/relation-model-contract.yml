name: DINO relation model contract

on:
  pull_request:
    branches: [master]
    paths:
      - 'tools/relation_training/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/relation-model-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relation-model-contract-onnx-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-ci-torch.txt
            tools/relation_training/requirements-ci.txt

      - name: Install focused CPU dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-ci-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-ci.txt

      - name: Compile Python contracts
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile \
            tools/relation_training/model.py \
            tools/relation_training/losses.py \
            tools/relation_training/checkpoint.py \
            tools/relation_training/export_onnx.py \
            tools/relation_training/test_model.py

      - name: Run synthetic forward/backward and ONNX contract
        shell: bash
        working-directory: tools/relation_training
        run: |
          set -euxo pipefail
          python -m unittest -v test_model.py

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

  real-vits16-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: ${{ runner.temp }}/hf-home
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Detect DINOv3 model access
        id: access
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${HF_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN is configured; attempting real DINOv3 qualification."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN is not configured; real DINOv3 qualification is skipped."
          fi

      - uses: actions/setup-python@v5
        if: steps.access.outputs.available == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-ci-torch.txt
            tools/relation_training/requirements-real-smoke.txt

      - name: Install real-smoke dependencies
        if: steps.access.outputs.available == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-ci-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-real-smoke.txt

      - name: Run real DINOv3 ViT-S/16 export smoke
        id: smoke
        if: steps.access.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/real-dinov3-smoke"
          python tools/relation_training/real_dinov3_smoke.py \
            --model facebook/dinov3-vits16-pretrain-lvd1689m \
            --image-size 224 \
            --output-dir "$RUNNER_TEMP/real-dinov3-smoke"

      - name: Record qualification result
        if: always()
        shell: bash
        run: |
          {
            echo "## Real DINOv3 relation smoke"
            echo
            echo "- exact head: `$EXPECTED_SHA`"
            echo "- model: `facebook/dinov3-vits16-pretrain-lvd1689m`"
            if [ "${{ steps.access.outputs.available }}" != "true" ]; then
              echo "- result: **SKIPPED** — HF_TOKEN is not configured"
            elif [ "${{ steps.smoke.outcome }}" = "success" ]; then
              echo "- result: **PASS**"
            else
              echo "- result: **FAIL (non-blocking evidence)** — inspect the smoke step"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.smoke.outcome == 'success'
        with:
          name: real-dinov3-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: ${{ runner.temp }}/real-dinov3-smoke/real-dinov3-smoke.json

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

