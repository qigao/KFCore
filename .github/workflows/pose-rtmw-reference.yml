name: RTMW ORT CPU golden qualification

on:
  push:
    branches: [master]
    paths:
      - 'runtime/**'
      - 'backends/onnxruntime/**'
      - 'vision/core/image_processor/**'
      - 'vision/image/cpu/**'
      - 'vision/core/pose/**'
      - 'tools/pose_qualification/**'
      - 'cmake/tests/pose_rtmw_ort_cpu_qualification/**'
      - 'CMakeOptions.cmake'
      - 'cmake/FindONNXRuntime.cmake'
      - '.github/workflows/pose-rtmw-reference.yml'
  pull_request:
    branches: [master]
    paths:
      - 'runtime/**'
      - 'backends/onnxruntime/**'
      - 'vision/core/image_processor/**'
      - 'vision/image/cpu/**'
      - 'vision/core/pose/**'
      - 'tools/pose_qualification/**'
      - 'cmake/tests/pose_rtmw_ort_cpu_qualification/**'
      - 'CMakeOptions.cmake'
      - 'cmake/FindONNXRuntime.cmake'
      - '.github/workflows/pose-rtmw-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pose-rtmw-ort-cpu-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-ort-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ORT_VERSION: 1.22.0
      ORT_SHA512: c49d927a39dc27fcdf3b41436806af74c24c79ead09289d986c359fc1380ea363cf83d4085212b8972cb752a0fa8b9b1a06b82ad19e2d4dd6e22e44c79050386
      RTMW_SDK_URL: https://download.openmmlab.com/mmpose/v1/projects/rtmw/onnx_sdk/rtmw-dw-x-l_simcc-cocktail14_270e-384x288_20231122.zip
      RTMW_SDK_SHA256: a87e1af41a0a067776dba7d46e1c21c8f6e9f18e247e0e606718dd1f31e96ffd
      RTMW_ONNX_SHA256: bd033156e5104c4f5d2edfe0453e02661e30a2f3da453ec93c8764d561b83054
      REAL_IMAGE_URL: https://upload.wikimedia.org/wikipedia/commons/d/de/Full-length_portrait_of_a_man%2C_standing%2C_facing_front_LCCN2005692477.jpg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install focused host tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build unzip curl libsimde-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover latest KFCore native SDK releases
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          releases = [
              ("SALTS", "qigao/salts", "Salts.Native."),
              ("SALTS_UTILS", "qigao/salts-utils", "SaltsUtils.Native."),
          ]
          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as output:
              for prefix, repo, asset_prefix in releases:
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/releases/latest",
                      headers={"Accept": "application/vnd.github+json", "User-Agent": "KFCore-CI"},
                  )
                  with urllib.request.urlopen(request) as response:
                      release = json.load(response)
                  tag = release["tag_name"]
                  version = tag[1:] if tag.startswith("v") else tag
                  expected_name = f"{asset_prefix}{version}.nupkg"
                  matches = [a for a in release["assets"] if a["name"] == expected_name]
                  if len(matches) != 1:
                      raise RuntimeError(f"{repo}: expected exactly one {expected_name}")
                  asset = matches[0]
                  digest = asset.get("digest") or ""
                  if not digest.startswith("sha256:"):
                      raise RuntimeError(f"{repo}: release asset lacks sha256 digest")
                  print(f"{prefix}_VERSION={version}", file=output)
                  print(f"{prefix}_URL={asset['browser_download_url']}", file=output)
                  print(f"{prefix}_SHA256={digest.split(':', 1)[1]}", file=output)
                  print(repo, tag, expected_name, digest)
          PY

      - name: Install independent Python reference dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check numpy==2.2.6 onnx==1.18.0 onnxruntime==1.22.0 opencv-python-headless==4.12.0.88

      - name: Restore native SDK download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kfcore-pose-rtmw-ort-cpu
          key: pose-rtmw-ort-cpu-sdk-v2-${{ runner.os }}-ort-${{ env.ORT_VERSION }}

      - name: Restore pinned native SDKs
        shell: bash
        run: |
          set -euxo pipefail
          cache="$HOME/.cache/kfcore-pose-rtmw-ort-cpu"
          mkdir -p "$cache"
          salts_pkg="$cache/Salts.Native.$SALTS_VERSION.nupkg"
          if [ ! -f "$salts_pkg" ]; then curl -fL --retry 3 "$SALTS_URL" -o "$salts_pkg"; fi
          echo "$SALTS_SHA256  $salts_pkg" | sha256sum -c -
          salts_utils_pkg="$cache/SaltsUtils.Native.$SALTS_UTILS_VERSION.nupkg"
          if [ ! -f "$salts_utils_pkg" ]; then curl -fL --retry 3 "$SALTS_UTILS_URL" -o "$salts_utils_pkg"; fi
          echo "$SALTS_UTILS_SHA256  $salts_utils_pkg" | sha256sum -c -
          ort_pkg="$cache/onnxruntime-linux-x64-$ORT_VERSION.tgz"
          if [ ! -f "$ort_pkg" ]; then curl -fL --retry 3 "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz" -o "$ort_pkg"; fi
          echo "$ORT_SHA512  $ort_pkg" | sha512sum -c -
          sdk="$RUNNER_TEMP/pose-rtmw-ort-cpu-sdk"
          rm -rf "$sdk"
          mkdir -p "$sdk/salts" "$sdk/salts-utils" "$sdk/ort"
          unzip -q "$salts_pkg" -d "$sdk/salts"
          unzip -q "$salts_utils_pkg" -d "$sdk/salts-utils"
          tar -xzf "$ort_pkg" -C "$sdk/ort"
          echo "SALTS_ROOT=$sdk/salts/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$sdk/salts-utils/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "ONNXRUNTIME_ROOT=$sdk/ort/onnxruntime-linux-x64-$ORT_VERSION" >> "$GITHUB_ENV"

      - name: Restore released RTMW-l 384x288 ONNX
        shell: bash
        run: |
          set -euxo pipefail
          ref="$RUNNER_TEMP/rtmw-reference"
          mkdir -p "$ref"
          curl --fail --location --retry 3 --output "$ref/sdk.zip" "$RTMW_SDK_URL"
          echo "$RTMW_SDK_SHA256  $ref/sdk.zip" | sha256sum --check -
          unzip -q "$ref/sdk.zip" end2end.onnx -d "$ref"
          echo "$RTMW_ONNX_SHA256  $ref/end2end.onnx" | sha256sum --check -

      - name: Generate independent Python ORT golden fixture
        shell: bash
        run: |
          set -euxo pipefail
          python tools/pose_qualification/make_rtmw_ort_cpu_qualification_fixture.py --onnx "$RUNNER_TEMP/rtmw-reference/end2end.onnx" --out-dir "$RUNNER_TEMP/rtmw-fixture"
          test -f "$RUNNER_TEMP/rtmw-fixture/model.json"
          test -f "$RUNNER_TEMP/rtmw-fixture/pose.json"
          test -f "$RUNNER_TEMP/rtmw-fixture/reference.tsv"
          test -f "$RUNNER_TEMP/rtmw-fixture/fixture-evidence.json"

      - name: Configure focused C++ RTMW ORT CPU qualification
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S cmake/tests/pose_rtmw_ort_cpu_qualification -B build/pose-rtmw-ort-cpu -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$SALTS_ROOT;$SALTS_UTILS_ROOT"

      - name: Build ORT plugin and RTMW qualification executable
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/pose-rtmw-ort-cpu --target kfcore_backend_onnxruntime kfcore_pose_rtmw_ort_cpu_qualification test_runtime_model_package test_pose_rtmw_contract --parallel 2

      - name: Run model-package and RTMW semantic contracts
        shell: bash
        run: |
          set -euxo pipefail
          package_test="$GITHUB_WORKSPACE/build/pose-rtmw-ort-cpu/bin/test_runtime_model_package"
          pose_test="$GITHUB_WORKSPACE/build/pose-rtmw-ort-cpu/bin/test_pose_rtmw_contract"
          test -x "$package_test"
          test -x "$pose_test"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$ONNXRUNTIME_ROOT/lib:${LD_LIBRARY_PATH:-}"
          "$package_test"
          "$pose_test"

      - name: Run layered C++ qualification
        shell: bash
        run: |
          set -euxo pipefail
          plugin="$GITHUB_WORKSPACE/build/pose-rtmw-ort-cpu/bin/libkfcore_backend_onnxruntime.so"
          executable="$GITHUB_WORKSPACE/build/pose-rtmw-ort-cpu/bin/kfcore_pose_rtmw_ort_cpu_qualification"
          report="$RUNNER_TEMP/rtmw-report.json"
          test -f "$plugin"
          test -x "$executable"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$ONNXRUNTIME_ROOT/lib:${LD_LIBRARY_PATH:-}"
          set +e
          "$executable" "$plugin" "$RUNNER_TEMP/rtmw-fixture" "$report"
          status=$?
          set -e
          test -f "$report"
          if [ "$status" -eq 1 ]; then
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Validate qualification evidence
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          evidence = json.loads((root / "rtmw-fixture" / "fixture-evidence.json").read_text())
          report = json.loads((root / "rtmw-report.json").read_text())
          assert evidence["schema"] == "kfcore.rtmw-ort-cpu-fixture/1"
          assert evidence["model_sha256"] == os.environ["RTMW_ONNX_SHA256"]
          assert evidence["input_size"] == [288, 384]
          assert evidence["keypoint_count"] == 133
          assert evidence["simcc_split_ratio"] == 2.0
          assert evidence["visibility"] == {
              "beta": 150.0,
              "sigma_x": 6.0,
              "sigma_y": 6.93,
          }
          semantic = root / "rtmw-fixture" / "pose.json"
          assert semantic.is_file()
          import hashlib
          assert hashlib.sha256(semantic.read_bytes()).hexdigest() == evidence["semantic_config_sha256"]
          assert report["schema"] == "kfcore.rtmw-ort-cpu-cpp-qualification/1"
          assert report["passed"] is True
          assert report["provider"] == "onnxruntime"
          assert report["device"] == "cpu"
          assert report["case_count"] == 3
          assert report["preprocess_max_levels"] <= 2.01
          assert report["preprocess_mean_levels"] <= 0.15
          assert report["simcc_max_abs"] <= 1.0e-4
          assert report["model_coord_max_abs"] <= 1.0e-6
          assert report["model_score_max_abs"] <= 1.0e-5
          assert report["visibility_decode_max_abs"] <= 1.0e-6
          assert report["visibility_wiring_max_abs"] <= 1.0e-6
          assert report["projection_coord_max_abs"] <= 1.0e-4
          assert report["e2e_source_coord_max_abs"] >= 0.0
          assert report["e2e_source_score_max_abs"] >= 0.0
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Download public-domain real-image fixture
        shell: bash
        run: |
          set -euxo pipefail
          image="$RUNNER_TEMP/rtmw-real-source.jpg"
          curl --fail --location --retry 3 \
            --user-agent 'KFCore-CI/1.0 (real-image qualification)' \
            --output "$image" "$REAL_IMAGE_URL"
          sha256sum "$image"
          python - <<'PY'
          import os
          from pathlib import Path
          import cv2

          path = Path(os.environ["RUNNER_TEMP"]) / "rtmw-real-source.jpg"
          image = cv2.imread(str(path), cv2.IMREAD_COLOR)
          if image is None:
              raise RuntimeError("cannot decode public-domain RTMW source image")
          print("real-image shape:", image.shape)
          assert image.shape[:2] == (4096, 3281)
          PY

      - name: Generate independent real-image RTMW fixtures
        shell: bash
        run: |
          set -euxo pipefail
          common=(
            --onnx "$RUNNER_TEMP/rtmw-reference/end2end.onnx"
            --image "$RUNNER_TEMP/rtmw-real-source.jpg"
            --source-url "$REAL_IMAGE_URL"
          )
          python tools/pose_qualification/make_rtmw_real_image_qualification_fixture.py \
            "${common[@]}" \
            --out-dir "$RUNNER_TEMP/rtmw-real-normal"
          python tools/pose_qualification/make_rtmw_real_image_qualification_fixture.py \
            "${common[@]}" \
            --occluded \
            --out-dir "$RUNNER_TEMP/rtmw-real-occluded"

      - name: Run real-image C++ qualification
        shell: bash
        run: |
          set -euxo pipefail
          plugin="$GITHUB_WORKSPACE/build/pose-rtmw-ort-cpu/bin/libkfcore_backend_onnxruntime.so"
          executable="$GITHUB_WORKSPACE/build/pose-rtmw-ort-cpu/bin/kfcore_pose_rtmw_ort_cpu_qualification"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$ONNXRUNTIME_ROOT/lib:${LD_LIBRARY_PATH:-}"
          for mode in normal occluded; do
            fixture="$RUNNER_TEMP/rtmw-real-$mode"
            report="$RUNNER_TEMP/rtmw-real-$mode-report.json"
            set +e
            "$executable" "$plugin" "$fixture" "$report"
            status=$?
            set -e
            test -f "$report"
            if [ "$status" -eq 1 ]; then
              exit 1
            fi
            if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          done

      - name: Validate and record real-image baseline evidence
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          evidence = {}
          reports = {}
          for mode in ("normal", "occluded"):
              fixture = root / f"rtmw-real-{mode}"
              evidence[mode] = json.loads(
                  (fixture / "fixture-evidence.json").read_text()
              )
              reports[mode] = json.loads(
                  (root / f"rtmw-real-{mode}-report.json").read_text()
              )

              assert evidence[mode]["schema"] == "kfcore.rtmw-real-image-fixture/1"
              assert evidence[mode]["model_sha256"] == os.environ["RTMW_ONNX_SHA256"]
              assert evidence[mode]["source_url"] == os.environ["REAL_IMAGE_URL"]
              assert evidence[mode]["source_size"] == [3281, 4096]
              assert evidence[mode]["keypoint_count"] == 133
              assert reports[mode]["passed"] is True

              # Contract gates remain strict. E2E coordinate/score deltas are
              # deliberately recorded but not thresholded in this discovery run.
              assert reports[mode]["preprocess_max_levels"] <= 2.01
              assert reports[mode]["preprocess_mean_levels"] <= 0.15
              assert reports[mode]["simcc_max_abs"] <= 1.0e-4
              assert reports[mode]["model_coord_max_abs"] <= 1.0e-6
              assert reports[mode]["model_score_max_abs"] <= 1.0e-5
              assert reports[mode]["visibility_decode_max_abs"] <= 1.0e-6
              assert reports[mode]["visibility_wiring_max_abs"] <= 1.0e-6
              assert reports[mode]["projection_coord_max_abs"] <= 1.0e-4

              expected_totals = {
                  "normal": {
                      "body": 68,
                      "foot": 24,
                      "face": 272,
                      "left_hand": 84,
                      "right_hand": 84,
                  },
                  "occluded": {
                      "body": 17,
                      "foot": 6,
                      "face": 68,
                      "left_hand": 21,
                      "right_hand": 21,
                  },
              }
              assert set(reports[mode]["regions"]) == set(expected_totals[mode])
              for region, expected_total in expected_totals[mode].items():
                  metrics = reports[mode]["regions"][region]
                  assert metrics["total"] == expected_total
                  assert 0 <= metrics["valid_coordinate_count"] <= expected_total
                  assert (
                      0
                      <= metrics["same_simcc_bin_count"]
                      <= metrics["valid_coordinate_count"]
                  )
                  for key in (
                      "coordinate_max_abs",
                      "coordinate_mean_abs",
                      "confidence_max_abs",
                      "confidence_mean_abs",
                      "visibility_max_abs",
                      "visibility_mean_abs",
                  ):
                      assert metrics[key] >= 0.0

          assert evidence["normal"]["source_image_sha256"] == evidence["occluded"]["source_image_sha256"]
          assert evidence["normal"]["occluded"] is False
          assert evidence["occluded"]["occluded"] is True

          print("REAL_IMAGE_SHA256=", evidence["normal"]["source_image_sha256"])
          print("normal report:", json.dumps(reports["normal"], indent=2, sort_keys=True))
          print("occluded report:", json.dumps(reports["occluded"], indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pose-rtmw-ort-cpu-qualification
          path: |
            ${{ runner.temp }}/rtmw-report.json
            ${{ runner.temp }}/rtmw-fixture/fixture-evidence.json
            ${{ runner.temp }}/rtmw-fixture/pose.json
            ${{ runner.temp }}/rtmw-real-normal-report.json
            ${{ runner.temp }}/rtmw-real-normal/fixture-evidence.json
            ${{ runner.temp }}/rtmw-real-occluded-report.json
            ${{ runner.temp }}/rtmw-real-occluded/fixture-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
