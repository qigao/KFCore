name: RTMW released reference

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/pose-rtmw-reference.yml'
      - 'vision/core/pose/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download released RTMW-l 384x288 ONNX SDK
        shell: bash
        run: |
          set -euxo pipefail
          url='https://download.openmmlab.com/mmpose/v1/projects/rtmw/onnx_sdk/rtmw-dw-x-l_simcc-cocktail14_270e-384x288_20231122.zip'
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/rtmw.zip" "$url"
          sha256sum "$RUNNER_TEMP/rtmw.zip"
          unzip -l "$RUNNER_TEMP/rtmw.zip"
