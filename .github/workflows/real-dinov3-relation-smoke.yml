name: Real DINOv3 relation smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-dinov3-relation-smoke-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  real-vits16:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.sha }}
      DINOV3_SHA: 6876159a11b4df116f30f667f8c9888617df0751
      DINOV3_WEIGHTS_URL: https://dl.fbaipublicfiles.com/dinov3/dinov3_vits16/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-real-smoke-torch.txt
            tools/relation_training/requirements-real-smoke.txt

      - name: Install real-smoke dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-real-smoke-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-real-smoke.txt

      - name: Checkout pinned Meta DINOv3 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/dinov3"
          git init "$RUNNER_TEMP/dinov3"
          git -C "$RUNNER_TEMP/dinov3" remote add origin https://github.com/facebookresearch/dinov3.git
          git -C "$RUNNER_TEMP/dinov3" fetch --depth=1 origin "$DINOV3_SHA"
          git -C "$RUNNER_TEMP/dinov3" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/dinov3" rev-parse HEAD)" = "$DINOV3_SHA"

      - name: Download official DINOv3 ViT-S/16 weights
        env:
          TORCH_HOME: ${{ runner.temp }}/torch-home
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$TORCH_HOME"
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse
          import torch

          url = os.environ["DINOV3_WEIGHTS_URL"]
          torch.hub.load_state_dict_from_url(
              url,
              map_location="cpu",
              check_hash=True,
              weights_only=True,
          )
          filename = Path(urlparse(url).path).name
          path = Path(torch.hub.get_dir()) / "checkpoints" / filename
          if not path.is_file():
              raise RuntimeError("DINOv3 weight download did not materialize")
          print(f"downloaded={path}")
          print(f"bytes={path.stat().st_size}")
          PY

      - name: Run real DINOv3 ViT-S/16 forward and export smoke
        env:
          TORCH_HOME: ${{ runner.temp }}/torch-home
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/real-dinov3-smoke"
          mkdir -p "$OUT"
          python tools/relation_training/real_dinov3_smoke.py \
            --dinov3-repo "$RUNNER_TEMP/dinov3" \
            --model dinov3_vits16 \
            --weights-url "$DINOV3_WEIGHTS_URL" \
            --image-size 224 \
            --output-dir "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: real-dinov3-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: ${{ runner.temp }}/real-dinov3-smoke/real-dinov3-smoke.json

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
