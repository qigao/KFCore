name: Predicate tokenizer contract

on:
  push:
    branches: [master]
    paths:
      - 'vision/core/relation/include/kfcore/relation/predicate_tokenizer_hf.hpp'
      - 'vision/core/relation/src/predicate_tokenizer_hf.cpp'
      - 'vision/core/relation/tests/test_predicate_tokenizer_hf.cpp'
      - 'vision/core/relation/tests/predicate_tokenizer_runtime_stub.cpp'
      - 'tools/relation_training/make_clip_tokenizer_contract.py'
      - 'tools/relation_training/requirements-clip-tokenizer-contract.txt'
      - '.github/workflows/predicate-tokenizer-contract.yml'
  pull_request:
    branches: [master]
    paths:
      - 'vision/core/relation/include/kfcore/relation/predicate_tokenizer_hf.hpp'
      - 'vision/core/relation/src/predicate_tokenizer_hf.cpp'
      - 'vision/core/relation/tests/test_predicate_tokenizer_hf.cpp'
      - 'vision/core/relation/tests/predicate_tokenizer_runtime_stub.cpp'
      - 'tools/relation_training/make_clip_tokenizer_contract.py'
      - 'tools/relation_training/requirements-clip-tokenizer-contract.txt'
      - '.github/workflows/predicate-tokenizer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predicate-tokenizer-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-clip-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TOKENIZERS_CPP_SHA: c586c52f93f7b060753bd2388eb96a105cb7374d
      RUST_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact KFCore source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Checkout pinned tokenizers-cpp
        uses: actions/checkout@v4
        with:
          repository: mlc-ai/tokenizers-cpp
          ref: ${{ env.TOKENIZERS_CPP_SHA }}
          path: tokenizers-cpp
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/relation_training/requirements-clip-tokenizer-contract.txt

      - name: Install reference tokenizer dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-clip-tokenizer-contract.txt

      - name: Generate Python CLIPTokenizer golden vectors
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/clip-tokenizer"
          python tools/relation_training/make_clip_tokenizer_contract.py \
            --out "$OUT"
          test -s "$OUT/tokenizer.json"
          test -s "$OUT/clip-tokenizer-golden.txt"

      - name: Pin Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Configure focused C++ tokenizer parity build
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          SRC="$RUNNER_TEMP/clip-tokenizer-cpp"
          BUILD="$RUNNER_TEMP/clip-tokenizer-build"
          mkdir -p "$SRC"
          cat > "$SRC/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.19)
          project(kfcore_clip_tokenizer_contract LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(MLC_ENABLE_SENTENCEPIECE_TOKENIZER OFF CACHE BOOL "" FORCE)
          add_subdirectory("$ENV{GITHUB_WORKSPACE}/tokenizers-cpp"
                           tokenizers-cpp EXCLUDE_FROM_ALL)
          add_executable(kfcore_clip_tokenizer_contract
            "$ENV{GITHUB_WORKSPACE}/vision/core/relation/src/predicate_tokenizer_hf.cpp"
            "$ENV{GITHUB_WORKSPACE}/vision/core/relation/tests/predicate_tokenizer_runtime_stub.cpp"
            "$ENV{GITHUB_WORKSPACE}/vision/core/relation/tests/test_predicate_tokenizer_hf.cpp")
          target_include_directories(kfcore_clip_tokenizer_contract PRIVATE
            "$ENV{GITHUB_WORKSPACE}/vision/core/relation/include"
            "$ENV{GITHUB_WORKSPACE}/runtime/core/include"
            "$ENV{GITHUB_WORKSPACE}/vision/core/image_processor/include"
            "$ENV{GITHUB_WORKSPACE}/tokenizers-cpp/include")
          target_compile_options(kfcore_clip_tokenizer_contract PRIVATE
            -Wall -Wextra -Wpedantic)
          target_link_libraries(kfcore_clip_tokenizer_contract PRIVATE
            tokenizers_c)
          CMAKE
          cmake -S "$SRC" -B "$BUILD" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD" --target kfcore_clip_tokenizer_contract --parallel 2

      - name: Compare C++ tokenizer against Python CLIPTokenizer
        shell: bash
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/clip-tokenizer-build/kfcore_clip_tokenizer_contract" \
            "$RUNNER_TEMP/clip-tokenizer/tokenizer.json" \
            "$RUNNER_TEMP/clip-tokenizer/clip-tokenizer-golden.txt"

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
