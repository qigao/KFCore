name: RTMW semantic contract

on:
  push:
    branches: [master]
    paths:
      - 'runtime/core/**'
      - 'vision/core/pose/**'
      - 'vision/core/image_processor/**'
      - 'vision/image/cpu/**'
      - 'cmake/tests/pose_rtmw_semantic_contract/**'
      - '.github/workflows/pose-rtmw-contract.yml'
  pull_request:
    branches: [master]
    paths:
      - 'runtime/core/**'
      - 'vision/core/pose/**'
      - 'vision/core/image_processor/**'
      - 'vision/image/cpu/**'
      - 'cmake/tests/pose_rtmw_semantic_contract/**'
      - '.github/workflows/pose-rtmw-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pose-rtmw-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Discover latest native SDK releases
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          releases = [
              ("SALTS", "qigao/salts", "Salts.Native."),
              ("SALTS_UTILS", "qigao/salts-utils", "SaltsUtils.Native."),
          ]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for prefix, repo, asset_prefix in releases:
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/releases/latest",
                      headers={"Accept": "application/vnd.github+json", "User-Agent": "KFCore-CI"},
                  )
                  with urllib.request.urlopen(request) as response:
                      release = json.load(response)
                  tag = release["tag_name"]
                  version = tag[1:] if tag.startswith("v") else tag
                  expected = f"{asset_prefix}{version}.nupkg"
                  assets = [a for a in release["assets"] if a["name"] == expected]
                  if len(assets) != 1:
                      raise RuntimeError(f"{repo}: expected exactly one {expected}")
                  asset = assets[0]
                  digest = asset.get("digest") or ""
                  if not digest.startswith("sha256:"):
                      raise RuntimeError(f"{repo}: release asset lacks sha256 digest")
                  print(f"{prefix}_VERSION={version}", file=output)
                  print(f"{prefix}_URL={asset['browser_download_url']}", file=output)
                  print(f"{prefix}_SHA256={digest.split(':', 1)[1]}", file=output)
                  print(repo, tag, expected, digest)
          PY

      - name: Restore native SDK download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kfcore-pose-rtmw-contract
          key: pose-rtmw-contract-sdk-v1-${{ runner.os }}

      - name: Restore latest native SDKs
        shell: bash
        run: |
          set -euxo pipefail
          cache="$HOME/.cache/kfcore-pose-rtmw-contract"
          mkdir -p "$cache"
          salts_pkg="$cache/Salts.Native.$SALTS_VERSION.nupkg"
          if [ ! -f "$salts_pkg" ]; then curl -fL --retry 3 "$SALTS_URL" -o "$salts_pkg"; fi
          echo "$SALTS_SHA256  $salts_pkg" | sha256sum -c -
          utils_pkg="$cache/SaltsUtils.Native.$SALTS_UTILS_VERSION.nupkg"
          if [ ! -f "$utils_pkg" ]; then curl -fL --retry 3 "$SALTS_UTILS_URL" -o "$utils_pkg"; fi
          echo "$SALTS_UTILS_SHA256  $utils_pkg" | sha256sum -c -
          sdk="$RUNNER_TEMP/pose-rtmw-contract-sdk"
          rm -rf "$sdk"
          mkdir -p "$sdk/salts" "$sdk/salts-utils"
          unzip -q "$salts_pkg" -d "$sdk/salts"
          unzip -q "$utils_pkg" -d "$sdk/salts-utils"
          echo "SALTS_ROOT=$sdk/salts/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$sdk/salts-utils/sdk/linux-x64" >> "$GITHUB_ENV"

      - name: Configure focused semantic contract
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S cmake/tests/pose_rtmw_semantic_contract -B build/pose-rtmw-contract -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$SALTS_ROOT;$SALTS_UTILS_ROOT"

      - name: Build focused contract tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/pose-rtmw-contract --target test_runtime_model_package test_pose_rtmw_contract --parallel 2

      - name: Run focused contract tests
        shell: bash
        run: |
          set -euxo pipefail
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:${LD_LIBRARY_PATH:-}"
          build/pose-rtmw-contract/bin/test_runtime_model_package
          build/pose-rtmw-contract/bin/test_pose_rtmw_contract

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
