name: Scene interaction contract

on:
  push:
    branches: [master]
    paths:
      - 'scene_interaction/**'
      - 'vision/core/yolo/include/kfcore/yolo/types.hpp'
      - 'vision/core/yolo/include/kfcore/yolo/tracking.hpp'
      - 'vision/core/yolo/src/tracking.cpp'
      - 'vision/pipelines/scene_graph/include/kfcore/pipelines/scene_graph.hpp'
      - 'vision/pipelines/scene_graph/src/scene_graph_detail.cpp'
      - 'vision/pipelines/scene_graph/src/scene_graph_detail.hpp'
      - 'trackers/**'
      - 'kalman/kalman_takasu.c'
      - 'kalman/kalman_takasu.h'
      - 'CMakeLists.txt'
      - '.github/workflows/scene-interaction-contract.yml'
  pull_request:
    branches: [master]
    paths:
      - 'scene_interaction/**'
      - 'vision/core/yolo/include/kfcore/yolo/types.hpp'
      - 'vision/core/yolo/include/kfcore/yolo/tracking.hpp'
      - 'vision/core/yolo/src/tracking.cpp'
      - 'vision/pipelines/scene_graph/include/kfcore/pipelines/scene_graph.hpp'
      - 'vision/pipelines/scene_graph/src/scene_graph_detail.cpp'
      - 'vision/pipelines/scene_graph/src/scene_graph_detail.hpp'
      - 'trackers/**'
      - 'kalman/kalman_takasu.c'
      - 'kalman/kalman_takasu.h'
      - 'CMakeLists.txt'
      - '.github/workflows/scene-interaction-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scene-interaction-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SALTS_SHA: c4197712261a563ed7e238152b34cb50a2ef98a9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install focused build dependency
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsimde-dev

      - name: Checkout pinned TinyTest source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: c4197712261a563ed7e238152b34cb50a2ef98a9
          path: salts
          persist-credentials: false

      - name: Compile temporal API contract
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -Wall -Wextra -Wpedantic -fsyntax-only             -Iscene_interaction/include             -Iscene_interaction/src             -Ivision/pipelines/scene_graph/include             -Ivision/core/relation/include             -Ivision/core/yolo/include             -Ivision/core/image_processor/include             -Ivision/image/cpu/include             -Iruntime/core/include             -Iesn             scene_interaction/src/scene_features.cpp             scene_interaction/src/interaction.cpp             scene_interaction/src/pipeline.cpp             scene_interaction/src/latency_report.cpp

      - name: Build temporal lifecycle tests
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/scene-interaction"

          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer             -Isalts/tinytest/include             -c salts/tinytest/src/tinytest.c             -o "$RUNNER_TEMP/scene-interaction/tinytest.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -Ivendor/miniblas             -c vendor/miniblas/miniblas.c             -o "$RUNNER_TEMP/scene-interaction/miniblas.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -Ivendor/miniblas             -c vendor/miniblas/linalg.c             -o "$RUNNER_TEMP/scene-interaction/linalg.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -Ivendor/miniblas -Iesn             -c esn/esn.c             -o "$RUNNER_TEMP/scene-interaction/esn.o"

          for source in scene_interaction/src/scene_features.cpp                         scene_interaction/src/interaction.cpp                         scene_interaction/src/pipeline.cpp                         scene_interaction/src/latency_report.cpp                         scene_interaction/tests/scene_graph_pipeline_test_stub.cpp                         scene_interaction/tests/test_scene_interaction.cpp; do
            object="$RUNNER_TEMP/scene-interaction/$(basename "${source%.*}").o"
            c++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic               -fsanitize=address,undefined -fno-omit-frame-pointer               -Iscene_interaction/include               -Iscene_interaction/src               -Ivision/pipelines/scene_graph/include               -Ivision/core/relation/include               -Ivision/core/yolo/include               -Ivision/core/image_processor/include               -Ivision/image/cpu/include               -Iruntime/core/include               -Ivendor/miniblas -Iesn -Isalts/tinytest/include               -c "$source" -o "$object"
          done

          c++ -fsanitize=address,undefined             "$RUNNER_TEMP/scene-interaction/tinytest.o"             "$RUNNER_TEMP/scene-interaction/miniblas.o"             "$RUNNER_TEMP/scene-interaction/linalg.o"             "$RUNNER_TEMP/scene-interaction/esn.o"             "$RUNNER_TEMP/scene-interaction/scene_features.o"             "$RUNNER_TEMP/scene-interaction/interaction.o"             "$RUNNER_TEMP/scene-interaction/pipeline.o"             "$RUNNER_TEMP/scene-interaction/latency_report.o"             "$RUNNER_TEMP/scene-interaction/scene_graph_pipeline_test_stub.o"             "$RUNNER_TEMP/scene-interaction/test_scene_interaction.o"             -lm -o "$RUNNER_TEMP/scene-interaction/test_scene_interaction"

      - name: Run temporal lifecycle tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/scene-interaction/test_scene_interaction"

      - name: Build tracked continuity qualification
        shell: bash
        run: |
          set -euxo pipefail
          out="$RUNNER_TEMP/scene-interaction"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ikalman -Ivendor/miniblas \
            -c kalman/kalman_takasu.c \
            -o "$out/kalman_takasu.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrackers/include -Ikalman -Ivendor/miniblas \
            -c trackers/src/tracker.c \
            -o "$out/tracker.o"

          c++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ivision/core/yolo/include -Ivision/core/yolo/src \
            -Ivision/core/image_processor/include \
            -Itrackers/include \
            -c vision/core/yolo/src/tracking.cpp \
            -o "$out/yolo_tracking.o"

          c++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ivision/pipelines/scene_graph/include \
            -Ivision/pipelines/scene_graph/src \
            -Ivision/core/relation/include \
            -Ivision/core/yolo/include \
            -Ivision/core/image_processor/include \
            -c vision/pipelines/scene_graph/src/scene_graph_detail.cpp \
            -o "$out/scene_graph_detail.o"

          c++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iscene_interaction/include -Iscene_interaction/src \
            -Ivision/pipelines/scene_graph/include \
            -Ivision/pipelines/scene_graph/src \
            -Ivision/core/relation/include \
            -Ivision/core/yolo/include \
            -Ivision/core/image_processor/include \
            -Itrackers/include -Iesn \
            -c scene_interaction/tests/tracking_continuity_qualification.cpp \
            -o "$out/tracking_continuity_qualification.o"

          c++ -fsanitize=address,undefined \
            "$out/miniblas.o" \
            "$out/linalg.o" \
            "$out/kalman_takasu.o" \
            "$out/tracker.o" \
            "$out/esn.o" \
            "$out/yolo_tracking.o" \
            "$out/scene_graph_detail.o" \
            "$out/scene_features.o" \
            "$out/interaction.o" \
            "$out/tracking_continuity_qualification.o" \
            -lm -o "$out/tracking_continuity_qualification"

      - name: Run tracked continuity qualification
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          out="$RUNNER_TEMP/scene-interaction"
          report="$out/tracking-continuity.json"
          "$out/tracking_continuity_qualification" "$report"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) /
               "scene-interaction" /
               "tracking-continuity.json").read_text(encoding="utf-8")
          )
          assert report["schema"] == "kfcore.tracked-relation-continuity/1"
          assert report["passed"] is True
          assert report["tracking_backend"] == "ByteTrack"
          assert report["tracking_epoch_before_reset"] == 1
          assert report["tracking_epoch_after_reset"] == 2
          assert report["numeric_track_ids_reused"] is True
          assert report["old_pair"]["epoch"] == 1
          assert report["new_pair"]["epoch"] == 2
          assert report["old_pair"]["subject"] == report["new_pair"]["subject"]
          assert report["old_pair"]["object"] == report["new_pair"]["object"]
          assert report["tracking_reset_reason"] == "tracking reset"
          assert report["vocabulary_change_reason"] == "vocabulary changed"
          assert report["pair_loss_reason"] == "pair lost"
          assert report["frame_gap_reason"] == "frame gap"
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tracked-relation-continuity
          path: ${{ runner.temp }}/scene-interaction/tracking-continuity.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
