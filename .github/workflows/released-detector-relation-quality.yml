name: Released detector-box relation quality

on:
  pull_request:
    branches: [master]
    paths:
      - 'tools/detector_qualification/run_yolox_detector_manifest.py'
      - 'tools/relation_training/run_released_detector_relation_qualification.py'
      - 'tools/relation_training/test_released_detector_relation_qualification.py'
      - '.github/workflows/released-detector-relation-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: released-detector-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  openimages-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VALIDATION_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-validation-annotations-vrd.csv
      CLASS_DESCRIPTIONS_URL: https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions-boxable.csv
      DOWNLOADER_URL: https://raw.githubusercontent.com/openimages/dataset/main/downloader.py
      YOLOX_SOURCE_URL: https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx
      YOLOX_SOURCE_SHA256: 427cc366d34e27ff7a03e2899b5e3671425c262ea2291f88bb942bc1cc70b0f7
      HF_REVISION: 2db90096be5217bdc7a9003c042950f45723d105
      REL_ONNX_SHA256: b8b6a047c5e0771a897a5015c2ffb09d8fe5e3ffa0651e1e61af0e8436a3617a
      PREDICATE_BANK_SHA256: 708f812d6579eab1be85b3378b79e376453c2d4f65b4fad9bcebb9f5bf05da06

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-ci-torch.txt
            tools/relation_training/requirements-ci.txt
            tools/relation_training/requirements-openimages-baseline.txt

      - name: Install qualification dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            -r tools/relation_training/requirements-ci-torch.txt
          python -m pip install --disable-pip-version-check \
            -r tools/relation_training/requirements-ci.txt
          python -m pip install --disable-pip-version-check \
            boto3>=1.35,<2 tqdm>=4.66,<5

      - name: Compile and run focused qualification tests
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile \
            tools/detector_qualification/run_yolox_detector_manifest.py \
            tools/relation_training/run_released_detector_relation_qualification.py \
            tools/relation_training/test_released_detector_relation_qualification.py
          cd tools/relation_training
          python -m unittest -v test_released_detector_relation_qualification.py

      - name: Download pinned relation and detector artifacts
        shell: bash
        run: |
          set -euxo pipefail
          src="$RUNNER_TEMP/released-quality-source"
          mkdir -p "$src"
          base="https://huggingface.co/maelic/relsgg-vits16plus/resolve/$HF_REVISION"
          curl -fL --retry 3 "$base/relateanything.onnx" -o "$src/relateanything.onnx"
          curl -fL --retry 3 "$base/predicate_bank.npz" -o "$src/predicate_bank.npz"
          curl -fL --retry 3 "$base/relateanything.json" -o "$src/relateanything.json"
          curl -fL --retry 3 "$YOLOX_SOURCE_URL" -o "$src/yolox_tiny.onnx"
          echo "$REL_ONNX_SHA256  $src/relateanything.onnx" | sha256sum -c -
          echo "$PREDICATE_BANK_SHA256  $src/predicate_bank.npz" | sha256sum -c -
          echo "$YOLOX_SOURCE_SHA256  $src/yolox_tiny.onnx" | sha256sum -c -
          python tools/detector_qualification/prepare_yolox_tiny.py \
            --source-onnx "$src/yolox_tiny.onnx" \
            --out-dir "$RUNNER_TEMP/yolox-qualified"

      - name: Download and restrict Open Images validation annotations
        shell: bash
        run: |
          set -euxo pipefail
          data="$RUNNER_TEMP/openimages-source"
          mkdir -p "$data"
          curl -fL --retry 3 "$VALIDATION_VRD_URL" -o "$data/validation-vrd.csv"
          curl -fL --retry 3 "$CLASS_DESCRIPTIONS_URL" -o "$data/classes.csv"

          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path
          import numpy as np

          root = Path(os.environ["RUNNER_TEMP"])
          source = root / "openimages-source" / "validation-vrd.csv"
          target = root / "openimages-source" / "validation-released-bank.csv"
          bank = np.load(
              root / "released-quality-source" / "predicate_bank.npz",
              allow_pickle=True,
          )
          names = {str(value) for value in bank["names"]}
          with source.open("r", encoding="utf-8-sig", newline="") as src:
              reader = csv.DictReader(src)
              assert reader.fieldnames is not None
              relation_key = (
                  "RelationshipLabel"
                  if "RelationshipLabel" in reader.fieldnames
                  else "RelationLabel"
              )
              kept = 0
              predicates = set()
              with target.open("w", encoding="utf-8", newline="") as dst:
                  writer = csv.DictWriter(dst, fieldnames=reader.fieldnames)
                  writer.writeheader()
                  for row in reader:
                      predicate = row[relation_key]
                      if predicate == "is" or predicate not in names:
                          continue
                      writer.writerow(row)
                      kept += 1
                      predicates.add(predicate)
          evidence = {
              "schema": "kfcore.openimages-released-bank-filter/1",
              "released_bank_size": len(names),
              "kept_rows": kept,
              "predicate_count": len(predicates),
              "predicates": sorted(predicates),
          }
          (root / "openimages-source" / "filter-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if kept == 0 or not predicates:
              raise SystemExit("released predicate bank has no Open Images overlap")
          PY

      - name: Select deterministic 16-image released-bank slice
        shell: bash
        run: |
          set -euxo pipefail
          data="$RUNNER_TEMP/openimages-source"
          subset="$RUNNER_TEMP/openimages-subset"
          mkdir -p "$subset"
          python tools/relation_training/convert_openimages.py subset \
            --split validation \
            --relationships "$data/validation-released-bank.csv" \
            --max-images 16 \
            --min-boxes 4 \
            --max-boxes 12 \
            --output-csv "$subset/validation.csv"
          python tools/relation_training/convert_openimages.py scan \
            --source "validation=$subset/validation.csv" \
            --class-descriptions "$data/classes.csv" \
            --output-dir "$RUNNER_TEMP/openimages-scan"

      - name: Download selected Open Images pixels
        shell: bash
        run: |
          set -euxo pipefail
          scan="$RUNNER_TEMP/openimages-scan"
          images="$RUNNER_TEMP/openimages-images"
          curl -fL --retry 3 "$DOWNLOADER_URL" -o "$RUNNER_TEMP/openimages-downloader.py"
          python "$RUNNER_TEMP/openimages-downloader.py" \
            "$scan/validation.image_ids.txt" \
            --download_folder="$images" \
            --num_processes=8
          test "$(find "$images" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 16

      - name: Convert canonical validation annotations
        shell: bash
        run: |
          set -euxo pipefail
          python tools/relation_training/convert_openimages.py convert \
            --split validation \
            --relationships "$RUNNER_TEMP/openimages-subset/validation.csv" \
            --class-descriptions "$RUNNER_TEMP/openimages-source/classes.csv" \
            --vocabulary "$RUNNER_TEMP/openimages-scan/vocabulary.json" \
            --image-root "$RUNNER_TEMP/openimages-images" \
            --output-dir "$RUNNER_TEMP/openimages-validation"

      - name: Run fixed YOLOX detector over qualification corpus
        shell: bash
        run: |
          set -euxo pipefail
          python tools/detector_qualification/run_yolox_detector_manifest.py \
            --model "$RUNNER_TEMP/yolox-qualified/yolox_tiny_decoded.onnx" \
            --annotations "$RUNNER_TEMP/openimages-validation/validation.jsonl" \
            --image-root "$RUNNER_TEMP/openimages-images" \
            --out "$RUNNER_TEMP/detector-boxes.jsonl" \
            --evidence-out "$RUNNER_TEMP/detector-evidence.json"

      - name: Run released RelateAnything detector-box quality
        shell: bash
        run: |
          set -euxo pipefail
          python tools/relation_training/run_released_detector_relation_qualification.py \
            --onnx "$RUNNER_TEMP/released-quality-source/relateanything.onnx" \
            --predicate-bank "$RUNNER_TEMP/released-quality-source/predicate_bank.npz" \
            --metadata "$RUNNER_TEMP/released-quality-source/relateanything.json" \
            --vocabulary "$RUNNER_TEMP/openimages-scan/vocabulary.json" \
            --annotations "$RUNNER_TEMP/openimages-validation/validation.jsonl" \
            --image-root "$RUNNER_TEMP/openimages-images" \
            --detector-predictions "$RUNNER_TEMP/detector-boxes.jsonl" \
            --detector-evidence "$RUNNER_TEMP/detector-evidence.json" \
            --iou-threshold 0.5 \
            --top-k 20 --top-k 50 --top-k 100 \
            --pair-weight 1.0 \
            --out "$RUNNER_TEMP/released-detector-quality.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads(
              (root / "released-detector-quality.json").read_text()
          )
          quality = report["quality"]
          assert report["schema"] == "kfcore.released-detector-box-relation-qualification/1"
          assert report["relation"]["training_reproduction_complete"] is False
          assert report["evaluation"]["detector_class_labels_enter_relation_inference"] is False
          failure = quality["failure_decomposition_at_max_k"]
          assert (
              failure["detector_miss"]
              + failure["sampler_miss"]
              + failure["predicate_miss"]
              + failure["recovered"]
              == quality["ground_truth_triplets"]
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: released-detector-relation-quality
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/released-detector-quality.json
            ${{ runner.temp }}/detector-evidence.json
            ${{ runner.temp }}/openimages-source/filter-evidence.json
            ${{ runner.temp }}/openimages-subset/validation.manifest.json
            ${{ runner.temp }}/openimages-scan/scan.manifest.json
            ${{ runner.temp }}/openimages-scan/vocabulary.json
            ${{ runner.temp }}/openimages-validation/validation.manifest.json

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
