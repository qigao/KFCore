name: Tracker status contract

on:
  push:
    branches: [master]
    paths:
      - 'trackers/**'
      - 'kalman/kalman_takasu.*'
      - 'kalman/kalman_status.h'
      - 'vendor/miniblas/**'
      - '.github/workflows/tracker-status-contract.yml'
  pull_request:
    branches: [master]
    paths:
      - 'trackers/**'
      - 'kalman/kalman_takasu.*'
      - 'kalman/kalman_status.h'
      - 'vendor/miniblas/**'
      - '.github/workflows/tracker-status-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracker-status-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-sanitized:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SALTS_SHA: c4197712261a563ed7e238152b34cb50a2ef98a9

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install focused build dependency
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsimde-dev

      - name: Checkout pinned TinyTest source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_SHA }}
          path: salts
          persist-credentials: false

      - name: Build tracker status contract
        shell: bash
        run: |
          set -euxo pipefail
          out="$RUNNER_TEMP/tracker-status"
          mkdir -p "$out"

          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer             -Isalts/tinytest/include             -c salts/tinytest/src/tinytest.c -o "$out/tinytest.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -Ivendor/miniblas             -c vendor/miniblas/miniblas.c -o "$out/miniblas.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -DKFCORE_LINALG_TEST_FAILURE             -Ivendor/miniblas             -c vendor/miniblas/linalg.c -o "$out/linalg.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -Ivendor/miniblas -Ikalman             -c kalman/kalman_takasu.c -o "$out/kalman_takasu.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -DKFCORE_TRACKERS_TEST_ALLOCATOR             -Itrackers/include -Itrackers/tests -Ivendor/miniblas -Ikalman             -c trackers/src/tracker.c -o "$out/tracker.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -Itrackers/tests             -c trackers/tests/tracker_test_alloc.c -o "$out/tracker_test_alloc.o"

          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -DKFCORE_LINALG_TEST_FAILURE             -Itrackers/include -Itrackers/tests -Ivendor/miniblas -Isalts/tinytest/include             -c trackers/tests/test_bytetrack_status.c -o "$out/test_bytetrack_status.o"

          cc -fsanitize=address,undefined             "$out/tinytest.o" "$out/miniblas.o" "$out/linalg.o"             "$out/kalman_takasu.o" "$out/tracker.o"             "$out/tracker_test_alloc.o" "$out/test_bytetrack_status.o"             -lm -o "$out/test_bytetrack_status"

      - name: Run tracker status contract
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/tracker-status/test_bytetrack_status"

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
