name: Pose semantic contract

on:
  push:
    branches: [master]
    paths:
      - 'vision/core/pose/**'
      - '.github/workflows/pose-contract.yml'
  pull_request:
    branches: [master]
    paths:
      - 'vision/core/pose/**'
      - '.github/workflows/pose-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pose-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SALTS_SHA: c4197712261a563ed7e238152b34cb50a2ef98a9

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Checkout pinned TinyTest source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_SHA }}
          path: salts
          persist-credentials: false

      - name: Build focused sanitizer tests
        shell: bash
        run: |
          set -euxo pipefail
          out="$RUNNER_TEMP/pose-contract"
          mkdir -p "$out"

          cc -std=c11 -O1 -g             -fsanitize=address,undefined -fno-omit-frame-pointer             -Isalts/tinytest/include             -c salts/tinytest/src/tinytest.c             -o "$out/tinytest.o"

          c++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -Ivision/core/pose/include             -c vision/core/pose/src/schema.cpp             -o "$out/schema.o"

          c++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic             -fsanitize=address,undefined -fno-omit-frame-pointer             -Ivision/core/pose/include             -Isalts/tinytest/include             -c vision/core/pose/tests/test_schema.cpp             -o "$out/test_schema.o"

          c++ -fsanitize=address,undefined             "$out/tinytest.o"             "$out/schema.o"             "$out/test_schema.o"             -o "$out/test_pose_schema"

      - name: Run focused sanitizer tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/pose-contract/test_pose_schema"
          "$RUNNER_TEMP/pose-contract/test_pose_simcc_decode"

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
