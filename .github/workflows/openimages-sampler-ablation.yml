name: Open Images sampler ablation

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/openimages-sampler-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openimages-sampler-ablation
  cancel-in-progress: false

jobs:
  ablation:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: p24-w1
            pair_budget: 24
            sampler_weight: 1.0
          - name: p48-w1
            pair_budget: 48
            sampler_weight: 1.0
          - name: p132-w1
            pair_budget: 132
            sampler_weight: 1.0
          - name: p24-w2
            pair_budget: 24
            sampler_weight: 2.0
          - name: p24-w4
            pair_budget: 24
            sampler_weight: 4.0
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SHA: ${{ github.sha }}
      TRAIN_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-train-annotations-vrd.csv
      VALIDATION_VRD_URL: https://storage.googleapis.com/openimages/v6/oidv6-validation-annotations-vrd.csv
      CLASS_DESCRIPTIONS_URL: https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions-boxable.csv
      DOWNLOADER_URL: https://raw.githubusercontent.com/openimages/dataset/main/downloader.py
      DINOV3_MODEL: hf_hub:timm/vit_small_patch16_dinov3.lvd1689m
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record exact source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/relation_training/requirements-real-smoke-torch.txt
            tools/relation_training/requirements-openimages-baseline.txt

      - name: Install focused experiment dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             -r tools/relation_training/requirements-real-smoke-torch.txt
          python -m pip install --disable-pip-version-check             -r tools/relation_training/requirements-openimages-baseline.txt

      - name: Download public Open Images annotations
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          mkdir -p "$DATA"
          curl --fail --location --retry 3 "$TRAIN_VRD_URL" -o "$DATA/train-vrd.csv"
          curl --fail --location --retry 3 "$VALIDATION_VRD_URL" -o "$DATA/validation-vrd.csv"
          curl --fail --location --retry 3 "$CLASS_DESCRIPTIONS_URL" -o "$DATA/classes.csv"

      - name: Recreate exact baseline-v1 slices
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          mkdir -p "$SUBSET"
          python tools/relation_training/convert_openimages.py subset             --split train             --relationships "$DATA/train-vrd.csv"             --max-images 256             --min-boxes 4             --max-boxes 12             --output-csv "$SUBSET/train.csv"
          python tools/relation_training/convert_openimages.py subset             --split validation             --relationships "$DATA/validation-vrd.csv"             --max-images 64             --min-boxes 4             --max-boxes 12             --output-csv "$SUBSET/validation.csv"

      - name: Build shared vocabulary and downloader lists
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          python tools/relation_training/convert_openimages.py scan             --source "train=$SUBSET/train.csv"             --source "validation=$SUBSET/validation.csv"             --class-descriptions "$DATA/classes.csv"             --output-dir "$RUNNER_TEMP/openimages-scan"

      - name: Download exact baseline-v1 pixels
        shell: bash
        run: |
          set -euxo pipefail
          SCAN="$RUNNER_TEMP/openimages-scan"
          IMAGES="$RUNNER_TEMP/openimages-images"
          curl --fail --location --retry 3 "$DOWNLOADER_URL" -o "$RUNNER_TEMP/openimages-downloader.py"
          python "$RUNNER_TEMP/openimages-downloader.py"             "$SCAN/train.image_ids.txt"             --download_folder="$IMAGES"             --num_processes=8
          python "$RUNNER_TEMP/openimages-downloader.py"             "$SCAN/validation.image_ids.txt"             --download_folder="$IMAGES"             --num_processes=8
          test "$(find "$IMAGES" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 320

      - name: Convert canonical splits
        shell: bash
        run: |
          set -euxo pipefail
          DATA="$RUNNER_TEMP/openimages-source"
          SUBSET="$RUNNER_TEMP/openimages-subset"
          SCAN="$RUNNER_TEMP/openimages-scan"
          IMAGES="$RUNNER_TEMP/openimages-images"
          python tools/relation_training/convert_openimages.py convert             --split train             --relationships "$SUBSET/train.csv"             --class-descriptions "$DATA/classes.csv"             --vocabulary "$SCAN/vocabulary.json"             --image-root "$IMAGES"             --output-dir "$RUNNER_TEMP/openimages-train"
          python tools/relation_training/convert_openimages.py convert             --split validation             --relationships "$SUBSET/validation.csv"             --class-descriptions "$DATA/classes.csv"             --vocabulary "$SCAN/vocabulary.json"             --image-root "$IMAGES"             --output-dir "$RUNNER_TEMP/openimages-validation"

      - name: Build identity predicate prototypes
        shell: bash
        run: |
          set -euxo pipefail
          python tools/relation_training/make_predicate_embeddings.py             --vocabulary "$RUNNER_TEMP/openimages-scan/vocabulary.json"             --out "$RUNNER_TEMP/predicate-embeddings.pt"

      - name: Train ablation arm
        env:
          HF_HOME: ${{ runner.temp }}/hf-home
          ARM_NAME: ${{ matrix.name }}
          PAIR_BUDGET: ${{ matrix.pair_budget }}
          SAMPLER_WEIGHT: ${{ matrix.sampler_weight }}
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/arm-$ARM_NAME"
          python tools/relation_training/train_baseline.py             --train-annotations "$RUNNER_TEMP/openimages-train/train.jsonl"             --validation-annotations "$RUNNER_TEMP/openimages-validation/validation.jsonl"             --vocabulary "$RUNNER_TEMP/openimages-scan/vocabulary.json"             --image-root "$RUNNER_TEMP/openimages-images"             --predicate-embeddings "$RUNNER_TEMP/predicate-embeddings.pt"             --output-dir "$OUT"             --backbone "$DINOV3_MODEL"             --image-size 224             --max-boxes 12             --pair-budget "$PAIR_BUDGET"             --hidden-dim 128             --geometry-dim 32             --num-heads 4             --num-layers 2             --epochs 3             --batch-size 8             --learning-rate 0.001             --weight-decay 0.0001             --sampler-loss-weight "$SAMPLER_WEIGHT"             --pair-loss-weight 1.0             --predicate-loss-weight 1.0             --device cpu

      - name: Build arm evidence
        env:
          ARM_NAME: ${{ matrix.name }}
          PAIR_BUDGET: ${{ matrix.pair_budget }}
          SAMPLER_WEIGHT: ${{ matrix.sampler_weight }}
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/arm-$ARM_NAME"
          EVIDENCE="$RUNNER_TEMP/evidence-$ARM_NAME"
          mkdir -p "$EVIDENCE"
          cp "$OUT/training.json" "$EVIDENCE/"
          cp "$OUT/benchmark.json" "$EVIDENCE/"
          cp "$RUNNER_TEMP/openimages-subset/train.manifest.json" "$EVIDENCE/subset-train.manifest.json"
          cp "$RUNNER_TEMP/openimages-subset/validation.manifest.json" "$EVIDENCE/subset-validation.manifest.json"
          cp "$RUNNER_TEMP/openimages-scan/vocabulary.json" "$EVIDENCE/"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          arm = os.environ["ARM_NAME"]
          evidence = Path(os.environ["RUNNER_TEMP"]) / f"evidence-{arm}"
          payload = {
              "schema": "kfcore.relation-sampler-ablation-arm/1",
              "exact_head": os.environ["EXPECTED_SHA"],
              "arm": arm,
              "pair_budget": int(os.environ["PAIR_BUDGET"]),
              "sampler_loss_weight": float(os.environ["SAMPLER_WEIGHT"]),
              "train_images": 256,
              "validation_images": 64,
              "min_boxes": 4,
              "max_boxes": 12,
              "epochs": 3,
              "seed": 20260929,
              "checkpoint_uploaded": False,
              "images_uploaded": False,
              "annotations_uploaded": False,
          }
          (evidence / "arm.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sampler-ablation-${{ matrix.name }}-${{ github.run_id }}
          retention-days: 14
          path: ${{ runner.temp }}/evidence-${{ matrix.name }}/

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

  compare:
    runs-on: ubuntu-24.04
    needs: ablation
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sampler-ablation-*
          path: arms
          merge-multiple: false

      - name: Build comparison report
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for arm_json in sorted(Path("arms").glob("*/arm.json")):
              root = arm_json.parent
              arm = json.loads(arm_json.read_text())
              training = json.loads((root / "training.json").read_text())
              benchmark = json.loads((root / "benchmark.json").read_text())
              row = {
                  "arm": arm["arm"],
                  "pair_budget": arm["pair_budget"],
                  "sampler_loss_weight": arm["sampler_loss_weight"],
                  "sampler_recall": benchmark["sampler_recall"],
                  "pair_ap": benchmark["pair_ap"],
                  "predicate_top1_accuracy": benchmark[
                      "predicate_top1_accuracy_on_sampled_pairs"
                  ],
                  "r20": benchmark["recall_at_k"]["20"],
                  "r50": benchmark["recall_at_k"]["50"],
                  "r100": benchmark["recall_at_k"]["100"],
                  "mr20": benchmark["mean_recall_at_k"]["20"],
                  "mr50": benchmark["mean_recall_at_k"]["50"],
                  "mr100": benchmark["mean_recall_at_k"]["100"],
                  "final_sampler_loss": training["history"][-1]["sampler_loss"],
                  "final_pair_loss": training["history"][-1]["pair_loss"],
                  "final_predicate_loss": training["history"][-1]["predicate_loss"],
                  "train_annotations_sha256": training["train_annotations_sha256"],
                  "validation_annotations_sha256": training["validation_annotations_sha256"],
                  "vocabulary_sha256": training["vocabulary_sha256"],
              }
              rows.append(row)

          if len(rows) != 5:
              raise RuntimeError(f"expected 5 ablation arms, got {len(rows)}")
          hashes = {
              (
                  row["train_annotations_sha256"],
                  row["validation_annotations_sha256"],
                  row["vocabulary_sha256"],
              )
              for row in rows
          }
          if len(hashes) != 1:
              raise RuntimeError("ablation arms do not share one dataset/vocabulary")

          anchor = next(row for row in rows if row["arm"] == "p24-w1")
          comparison = []
          for row in rows:
              item = dict(row)
              item["delta_vs_anchor"] = {
                  key: row[key] - anchor[key]
                  for key in (
                      "sampler_recall",
                      "pair_ap",
                      "predicate_top1_accuracy",
                      "r20",
                      "r50",
                      "r100",
                      "mr20",
                      "mr50",
                      "mr100",
                  )
              }
              comparison.append(item)

          payload = {
              "schema": "kfcore.relation-sampler-ablation/1",
              "anchor": "p24-w1",
              "arms": comparison,
          }
          Path("comparison.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sampler-ablation-comparison-${{ github.run_id }}
          retention-days: 30
          path: comparison.json
