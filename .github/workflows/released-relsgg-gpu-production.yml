name: Released RelateAnything GPU production qualification

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Explicit Linux self-hosted NVIDIA runner label'
        required: true
        type: string
      device_id:
        description: 'KFCore CUDA device id'
        required: true
        default: 'cuda:0'
        type: string
      opt_vocab:
        description: 'TensorRT dynamic-V profile opt size'
        required: true
        default: '64'
        type: string
      max_vocab:
        description: 'TensorRT dynamic-V profile max size'
        required: true
        default: '243'
        type: string
      workspace_gib:
        description: 'TensorRT build workspace GiB'
        required: true
        default: '4'
        type: string

permissions:
  contents: read

concurrency:
  group: released-relsgg-gpu-${{ inputs.runner_label }}
  cancel-in-progress: false

jobs:
  gpu-production:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.sha }}
      HF_REVISION: 2db90096be5217bdc7a9003c042950f45723d105
      REL_ONNX_SHA256: b8b6a047c5e0771a897a5015c2ffb09d8fe5e3ffa0651e1e61af0e8436a3617a
      PREDICATE_BANK_SHA256: 708f812d6579eab1be85b3378b79e376453c2d4f65b4fad9bcebb9f5bf05da06
      YOLOX_SOURCE_URL: https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx
      YOLOX_SOURCE_SHA256: 427cc366d34e27ff7a03e2899b5e3671425c262ea2291f88bb942bc1cc70b0f7
      YOLOX_DEMO_URL: https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/e1052df71842031413f6030723c3607b839c80ce/assets/demo.png
      SALTS_VERSION: 1.8.9
      SALTS_SHA256: dd88fac95bbd8f63f4411ebcde94358b9041046166a84a1d6903d7443cf3b959
      SALTS_UTILS_VERSION: 4.1.13
      SALTS_UTILS_SHA256: b5f41e8a403557a3a0a9594fcd2325bf169656173e2614cf4379d123a78ab7f5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require exact source and GPU SDK environment
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(uname -s)" = "Linux"
          for command in nvidia-smi cmake ninja curl unzip python3; do
            command -v "$command"
          done
          test -n "${ONNXRUNTIME_ROOT:-}"
          test -d "$ONNXRUNTIME_ROOT"
          test -n "${TENSORRT_ROOT:-}"
          test -d "$TENSORRT_ROOT"
          nvidia-smi

          python3 - <<'PY'
          import json
          import platform
          import sys

          import numpy
          import onnx
          import onnxruntime as ort
          import tensorrt as trt
          import torch

          if not torch.cuda.is_available():
              raise SystemExit("CUDA-enabled torch with a visible NVIDIA GPU is required")
          providers = set(ort.get_available_providers())
          if "CUDAExecutionProvider" not in providers:
              raise SystemExit(
                  f"ONNX Runtime Python lacks CUDAExecutionProvider: {sorted(providers)}"
              )
          if int(str(trt.__version__).split(".", 1)[0]) < 10:
              raise SystemExit(f"TensorRT >=10 is required; got {trt.__version__}")
          device = torch.cuda.current_device()
          print(json.dumps({
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "onnx": onnx.__version__,
              "onnxruntime": ort.__version__,
              "providers": sorted(providers),
              "tensorrt": trt.__version__,
              "torch": torch.__version__,
              "torch_cuda": torch.version.cuda,
              "gpu": torch.cuda.get_device_name(device),
              "compute_capability": list(torch.cuda.get_device_capability(device)),
          }, indent=2, sort_keys=True))
          PY

      - name: Download pinned released model
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/released-gpu-source"
          mkdir -p "$root"
          base="https://huggingface.co/maelic/relsgg-vits16plus/resolve/$HF_REVISION"
          curl -fL --retry 3 "$base/relateanything.onnx" -o "$root/relateanything.onnx"
          curl -fL --retry 3 "$base/predicate_bank.npz" -o "$root/predicate_bank.npz"
          curl -fL --retry 3 "$base/relateanything.json" -o "$root/relateanything.json"
          echo "$REL_ONNX_SHA256  $root/relateanything.onnx" | sha256sum -c -
          echo "$PREDICATE_BANK_SHA256  $root/predicate_bank.npz" | sha256sum -c -

          python3 tools/relation_training/prepare_released_relsgg.py \
            --onnx "$root/relateanything.onnx" \
            --predicate-bank "$root/predicate_bank.npz" \
            --metadata "$root/relateanything.json" \
            --out-dir "$RUNNER_TEMP/released-ort-package"

          python3 tools/relation_training/prepare_released_tensorrt_source.py \
            --onnx "$root/relateanything.onnx" \
            --predicate-bank "$root/predicate_bank.npz" \
            --out "$root/tensorrt-source.json"

          curl -fL --retry 3 "$YOLOX_SOURCE_URL" -o "$root/yolox_tiny.onnx"
          echo "$YOLOX_SOURCE_SHA256  $root/yolox_tiny.onnx" | sha256sum -c -
          python3 tools/detector_qualification/prepare_yolox_tiny.py \
            --source-onnx "$root/yolox_tiny.onnx" \
            --out-dir "$RUNNER_TEMP/yolox-gpu-package"

      - name: Build one released dynamic-V TensorRT engine
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/released-gpu-source"
          python3 tools/relation_training/build_dynamic_vocab_tensorrt.py \
            --onnx "$root/relateanything.onnx" \
            --metadata "$root/tensorrt-source.json" \
            --out "$RUNNER_TEMP/relation.engine" \
            --opt-vocab "${{ inputs.opt_vocab }}" \
            --max-vocab "${{ inputs.max_vocab }}" \
            --workspace-gib "${{ inputs.workspace_gib }}" \
            --device cuda

          test -s "$RUNNER_TEMP/relation.engine"
          test -s "$RUNNER_TEMP/relation.json"

      - name: Qualify TensorRT numerical parity before production packaging
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/released-gpu-source"
          python3 tools/relation_training/tensorrt_dynamic_vocab_qualification.py \
            --onnx "$root/relateanything.onnx" \
            --engine "$RUNNER_TEMP/relation.engine" \
            --engine-metadata "$RUNNER_TEMP/relation.json" \
            --out "$RUNNER_TEMP/tensorrt-dynamic-v-report.json" \
            --warmup 2 \
            --iterations 5 \
            --ort-provider CPUExecutionProvider

      - name: Build production GPU ModelPackage
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/released-gpu-source"
          python3 tools/relation_training/package_released_relsgg_gpu.py \
            --onnx "$root/relateanything.onnx" \
            --predicate-bank "$root/predicate_bank.npz" \
            --engine "$RUNNER_TEMP/relation.engine" \
            --engine-metadata "$RUNNER_TEMP/relation.json" \
            --out-dir "$RUNNER_TEMP/released-gpu-package" \
            --hardware-compatibility exact-device

      - name: Prepare real SceneBehavior smoke fixture
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/released-gpu-source"
          fixture="$RUNNER_TEMP/gpu-scene-fixture"
          mkdir -p "$fixture/frames"
          curl -fL --retry 3 "$YOLOX_DEMO_URL" -o "$fixture/demo.png"

          python3 - <<'PY'
          import os
          import struct
          from pathlib import Path

          import numpy as np
          from PIL import Image

          root = Path(os.environ["RUNNER_TEMP"])
          source = root / "released-gpu-source"
          fixture = root / "gpu-scene-fixture"

          with Image.open(fixture / "demo.png") as image:
              rgb = np.asarray(image.convert("RGB"), dtype=np.uint8)
          height, width, _ = rgb.shape
          bgr = np.ascontiguousarray(rgb[:, :, ::-1])
          (fixture / "frames" / "demo.bgr").write_bytes(
              bgr.tobytes(order="C")
          )
          (fixture / "frames.tsv").write_text(
              f"frames/demo.bgr\t{width}\t{height}\tdemo.png\n",
              encoding="utf-8",
          )

          bank = np.load(
              source / "predicate_bank.npz",
              allow_pickle=True,
          )
          names = [str(value) for value in bank["names"]]
          W = np.asarray(bank["W"], dtype=np.float32)
          alpha = np.asarray(bank["alpha"], dtype=np.float32)
          selected = [
              str(value)
              for value in bank["default"]
          ][: min(14, len(bank["default"]))]
          index = {name: i for i, name in enumerate(names)}
          if not selected or any(name not in index for name in selected):
              raise SystemExit("released default vocabulary cannot be resolved")
          with (fixture / "vocabulary.bin").open("wb") as stream:
              stream.write(b"KFRELVO1")
              stream.write(struct.pack("<II", len(selected), 512))
              for name in selected:
                  row = index[name]
                  encoded = name.encode("utf-8")
                  stream.write(struct.pack("<I", len(encoded)))
                  stream.write(encoded)
                  stream.write(struct.pack("<f", float(alpha[row])))
                  stream.write(
                      np.asarray(W[row], dtype="<f4").tobytes(order="C")
                  )
          PY

      - name: Restore native SDK download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kfcore-relation-gpu
          key: relation-gpu-sdk-v1-salts-${{ env.SALTS_VERSION }}-saltsutils-${{ env.SALTS_UTILS_VERSION }}

      - name: Restore pinned KFCore native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cache="$HOME/.cache/kfcore-relation-gpu"
          mkdir -p "$cache"
          salts_pkg="$cache/Salts.Native.$SALTS_VERSION.nupkg"
          salts_utils_pkg="$cache/SaltsUtils.Native.$SALTS_UTILS_VERSION.nupkg"
          test -f "$salts_pkg" || curl -fL --retry 3 \
            "https://github.com/qigao/salts/releases/download/v$SALTS_VERSION/Salts.Native.$SALTS_VERSION.nupkg" \
            -o "$salts_pkg"
          test -f "$salts_utils_pkg" || curl -fL --retry 3 \
            "https://github.com/qigao/salts-utils/releases/download/v$SALTS_UTILS_VERSION/SaltsUtils.Native.$SALTS_UTILS_VERSION.nupkg" \
            -o "$salts_utils_pkg"
          echo "$SALTS_SHA256  $salts_pkg" | sha256sum -c -
          echo "$SALTS_UTILS_SHA256  $salts_utils_pkg" | sha256sum -c -

          sdk="$RUNNER_TEMP/released-gpu-sdk"
          rm -rf "$sdk"
          mkdir -p "$sdk/salts" "$sdk/salts-utils"
          unzip -q "$salts_pkg" -d "$sdk/salts"
          unzip -q "$salts_utils_pkg" -d "$sdk/salts-utils"
          echo "SALTS_ROOT=$sdk/salts/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$sdk/salts-utils/sdk/linux-x64" >> "$GITHUB_ENV"

      - name: Build focused C++ GPU runtime
        shell: bash
        run: |
          set -euxo pipefail
          cmake \
            -S cmake/tests/released_scene_behavior_gpu \
            -B build/scene-gpu \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$SALTS_ROOT;$SALTS_UTILS_ROOT"
          cmake --build build/scene-gpu \
            --target \
              kfcore_backend_onnxruntime \
              kfcore_backend_tensorrt \
              kfcore_released_relsgg_qualification \
              kfcore_released_scene_behavior_latency \
            --parallel 2

      - name: Run C++ ORT CUDA production route
        shell: bash
        run: |
          set -euxo pipefail
          exe="$GITHUB_WORKSPACE/build/scene-gpu/bin/kfcore_released_relsgg_qualification"
          plugin="$GITHUB_WORKSPACE/build/scene-gpu/bin/libkfcore_backend_onnxruntime.so"
          trt_libs="$TENSORRT_ROOT/lib:$TENSORRT_ROOT/lib64:$TENSORRT_ROOT/targets/x86_64-linux-gnu/lib"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$ONNXRUNTIME_ROOT/lib:$ONNXRUNTIME_ROOT/lib64:$trt_libs:${LD_LIBRARY_PATH:-}"

          "$exe" \
            "$plugin" \
            "$RUNNER_TEMP/released-gpu-package" \
            "$RUNNER_TEMP/released-ort-cuda-runtime.json" \
            onnxruntime \
            "${{ inputs.device_id }}"

      - name: Run C++ TensorRT production route
        shell: bash
        run: |
          set -euxo pipefail
          exe="$GITHUB_WORKSPACE/build/scene-gpu/bin/kfcore_released_relsgg_qualification"
          plugin="$GITHUB_WORKSPACE/build/scene-gpu/bin/libkfcore_backend_tensorrt.so"
          trt_libs="$TENSORRT_ROOT/lib:$TENSORRT_ROOT/lib64:$TENSORRT_ROOT/targets/x86_64-linux-gnu/lib"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$ONNXRUNTIME_ROOT/lib:$ONNXRUNTIME_ROOT/lib64:$trt_libs:${LD_LIBRARY_PATH:-}"

          "$exe" \
            "$plugin" \
            "$RUNNER_TEMP/released-gpu-package" \
            "$RUNNER_TEMP/released-tensorrt-runtime.json" \
            tensorrt \
            "${{ inputs.device_id }}"

      - name: Run full C++ SceneBehavior on ORT CUDA
        shell: bash
        run: |
          set -euxo pipefail
          exe="$GITHUB_WORKSPACE/build/scene-gpu/bin/kfcore_released_scene_behavior_latency"
          ort="$GITHUB_WORKSPACE/build/scene-gpu/bin/libkfcore_backend_onnxruntime.so"
          trt_libs="$TENSORRT_ROOT/lib:$TENSORRT_ROOT/lib64:$TENSORRT_ROOT/targets/x86_64-linux-gnu/lib"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$ONNXRUNTIME_ROOT/lib:$ONNXRUNTIME_ROOT/lib64:$trt_libs:${LD_LIBRARY_PATH:-}"

          "$exe" \
            "$ort" "$ort" \
            "$RUNNER_TEMP/yolox-gpu-package" \
            "$RUNNER_TEMP/released-gpu-package" \
            "$RUNNER_TEMP/gpu-scene-fixture/vocabulary.bin" \
            "$RUNNER_TEMP/gpu-scene-fixture/frames.tsv" \
            "$RUNNER_TEMP/scene-ort-cuda.jsonl" \
            onnxruntime "${{ inputs.device_id }}" \
            onnxruntime "${{ inputs.device_id }}"

      - name: Run full C++ SceneBehavior with TensorRT relation
        shell: bash
        run: |
          set -euxo pipefail
          exe="$GITHUB_WORKSPACE/build/scene-gpu/bin/kfcore_released_scene_behavior_latency"
          ort="$GITHUB_WORKSPACE/build/scene-gpu/bin/libkfcore_backend_onnxruntime.so"
          trt="$GITHUB_WORKSPACE/build/scene-gpu/bin/libkfcore_backend_tensorrt.so"
          trt_libs="$TENSORRT_ROOT/lib:$TENSORRT_ROOT/lib64:$TENSORRT_ROOT/targets/x86_64-linux-gnu/lib"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$ONNXRUNTIME_ROOT/lib:$ONNXRUNTIME_ROOT/lib64:$trt_libs:${LD_LIBRARY_PATH:-}"

          "$exe" \
            "$ort" "$trt" \
            "$RUNNER_TEMP/yolox-gpu-package" \
            "$RUNNER_TEMP/released-gpu-package" \
            "$RUNNER_TEMP/gpu-scene-fixture/vocabulary.bin" \
            "$RUNNER_TEMP/gpu-scene-fixture/frames.tsv" \
            "$RUNNER_TEMP/scene-tensorrt.jsonl" \
            onnxruntime "${{ inputs.device_id }}" \
            tensorrt "${{ inputs.device_id }}"

      - name: Verify production routes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          ort = json.loads((root / "released-ort-cuda-runtime.json").read_text())
          trt = json.loads((root / "released-tensorrt-runtime.json").read_text())
          package = json.loads((root / "released-gpu-package" / "model.json").read_text())
          parity = json.loads((root / "tensorrt-dynamic-v-report.json").read_text())

          assert ort["passed"] is True
          assert ort["provider"] == "onnxruntime"
          assert ort["device"].startswith("cuda:")
          assert ort["backend_scoring"] is True
          assert ort["object_labels_enter_relation_inference"] is False
          assert ort["vocabulary_sizes"] == [1, 3]

          assert trt["passed"] is True
          assert trt["provider"] == "tensorrt"
          assert trt["device"].startswith("cuda:")
          assert trt["backend_scoring"] is True
          assert trt["object_labels_enter_relation_inference"] is False
          assert trt["vocabulary_sizes"] == [1, 3]

          assert parity["hardware_executed"] is True
          assert parity["same_engine_reused"] is True
          assert parity["same_context_reused"] is True
          assert parity["passed"] is True

          routes = {
              (artifact["backend"], artifact["device"])
              for artifact in package["artifacts"]
          }
          assert ("onnxruntime", "cpu") in routes
          assert ("onnxruntime", "cuda") in routes
          assert ("tensorrt", "cuda") in routes

          for name in ("scene-ort-cuda.jsonl", "scene-tensorrt.jsonl"):
              rows = [
                  json.loads(line)
                  for line in (root / name).read_text().splitlines()
                  if line.strip()
              ]
              assert len(rows) == 1
              sample = rows[0]
              assert sample["schema"] == "kfcore.scene-behavior-timing-sample/1"
              assert sample["detection_count"] > 0
              assert sample["tracked_object_count"] > 0
              assert sample["detector_ms"] >= 0.0
              assert sample["relation_ms"] >= 0.0
              assert sample["temporal_ms"] >= 0.0
              assert sample["total_ms"] >= 0.0
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: released-relsgg-gpu-production-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/released-gpu-package/model.json
            ${{ runner.temp }}/released-gpu-package/evidence.json
            ${{ runner.temp }}/released-gpu-package/tensorrt.json
            ${{ runner.temp }}/tensorrt-dynamic-v-report.json
            ${{ runner.temp }}/released-ort-cuda-runtime.json
            ${{ runner.temp }}/released-tensorrt-runtime.json
            ${{ runner.temp }}/scene-ort-cuda.jsonl
            ${{ runner.temp }}/scene-tensorrt.jsonl
            ${{ runner.temp }}/yolox-gpu-package/model.json
            ${{ runner.temp }}/yolox-gpu-package/evidence.json

      - name: Verify unchanged tracked sources
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
